<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能动态排班管理设置 (云端连结自動解析版)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- 顶部标头 -->
        <header class="bg-indigo-600 text-white shadow rounded-2xl p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">⚙️</span>
                <div>
                    <h1 class="text-2xl font-bold">智能动态排班管理设置</h1>
                    <p class="text-xs text-indigo-200 mt-1">支援云端假表连结自动抓取、员工锁定与自建岗位</p>
                </div>
            </div>
            <div id="sync-status" class="text-xs bg-indigo-500 text-white px-4 py-2 rounded-full font-medium shadow-inner">
                🔄 连线同步中...
            </div>
        </header>

        <!-- 控制面板区块 -->
        <div class="bg-white shadow rounded-2xl p-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center border-b border-slate-100 pb-6">
                <!-- 选择月份 -->
                <div>
                    <label class="block font-bold text-slate-700 text-sm mb-1">📅 选择排班月份：</label>
                    <input type="month" id="month-select" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value="2026-10">
                </div>

                <!-- 员工管理 -->
                <div class="md:col-span-2">
                    <label class="block font-bold text-slate-700 text-sm mb-1">👥 员工管理：</label>
                    <div class="flex flex-wrap gap-2 items-center">
                        <input type="text" id="new-employee-name" placeholder="输入员工姓名..." class="border border-slate-300 rounded-xl px-3 py-2 text-sm w-48 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="addEmployee()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">添加</button>
                        <button onclick="removeSelectedEmployee()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition">移除选中</button>
                        <select id="employee-select-target" class="border border-slate-300 rounded-xl px-3 py-2 text-sm flex-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">-- 选择要管理的员工 --</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 导入云端假表连结 -->
            <div class="space-y-2 border-b border-slate-100 pb-6">
                <label class="block font-bold text-slate-700 text-sm">📥 导入当前月份的云端假表连结 (Google Sheets)：</label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="cloud-sheet-url" placeholder="请贴上云端 Google Sheets 共用连结..." 
                        class="flex-1 border border-slate-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="importCloudLeaves()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm whitespace-nowrap">
                        🟢 抓取当月休假日
                    </button>
                    <button onclick="clearMonthLeaves()" class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm whitespace-nowrap">
                        🗑️ 清空当月休假
                    </button>
                </div>
                <p class="text-xs text-slate-400">💡 提示：系统会自动读取该云端表格，并**只会抓取网页上方已建立的员工名字**所对应的休假日期进行锁定！</p>
            </div>

            <!-- 岗位与强度设置 -->
            <div class="space-y-3">
                <label class="block font-bold text-slate-700 text-sm">🏷️ 岗位与强度设置：</label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="new-shift-name" placeholder="输入岗位名称 (换行用 \n)" class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <select id="new-shift-intensity" class="border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="中">🟡 中强度</option>
                        <option value="低">🟢 低强度</option>
                        <option value="高">🔴 高强度</option>
                    </select>
                    <button onclick="addShifts()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl text-sm font-medium transition whitespace-nowrap">添加岗位</button>
                </div>
                <div id="shift-list-container" class="flex flex-wrap gap-2 pt-2">
                    <!-- 动态生成自建岗位标签 -->
                </div>
            </div>

            <!-- 操作按钮列 -->
            <div class="flex flex-wrap gap-3 pt-2">
                <button onclick="autoSchedule()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">
                    ✨ 执行智能排班
                </button>
                <button onclick="clearMonthData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-5 py-2.5 rounded-xl text-sm font-medium transition">
                    重置当月资料
                </button>
            </div>
        </div>

        <!-- 排班工作表预览 -->
        <div class="bg-white shadow rounded-2xl p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                <h2 id="table-title" class="font-bold text-slate-800 text-lg">📊 排班工作表预览</h2>
                <span class="text-xs text-slate-500">🔒 锁定状态：云端读取之员工休假无法更改</span>
            </div>
            <div class="overflow-x-auto min-h-[400px]">
                <table id="schedule-table" class="w-full text-left border-collapse">
                    <!-- 动态生成 -->
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://untcdzgliocuplqifejc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_exIdFgcOJ3eIRXrahU5LAw_Tr_43AMw';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let employees = [];
        let shifts = [
            { name: '休', intensity: '低' },
            { name: 'OL FB JY', intensity: '中' },
            { name: 'MT XO SH YS', intensity: '中' },
            { name: '支援', intensity: '低' }
        ];
        let currentSchedules = {};

        async function init() {
            updateSyncStatus('连线中...', 'bg-amber-500 text-white');
            await loadEmployees();
            loadShiftsLocal();
            await loadSchedulesFromCloud();
            renderEmployeeSelect();
            renderShiftList();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        function updateSyncStatus(text, className) {
            const badge = document.getElementById('sync-status');
            badge.className = `text-xs px-3 py-1.5 rounded-full font-medium shadow-inner ${className}`;
            badge.innerText = text;
        }

        // 员工管理
        async function loadEmployees() {
            const { data } = await _supabase.from('employees').select('*').order('created_at', { ascending: true });
            employees = data ? data.map(item => item.name) : [];
        }

        async function addEmployee() {
            const input = document.getElementById('new-employee-name');
            const name = input.value.trim();
            if (!name) return;
            if (employees.includes(name)) { alert('员工已存在！'); return; }

            updateSyncStatus('同步中...', 'bg-amber-500 text-white');
            await _supabase.from('employees').insert([{ name }]);
            input.value = '';
            await loadEmployees();
            renderEmployeeSelect();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        async function removeSelectedEmployee() {
            const select = document.getElementById('employee-select-target');
            const name = select.value;
            if (!name) { alert('请先在下拉选单选择要移除的员工！'); return; }
            if (!confirm(`确定要移除员工「${name}」吗？`)) return;

            updateSyncStatus('同步中...', 'bg-amber-500 text-white');
            await _supabase.from('employees').delete().eq('name', name);
            await _supabase.from('schedules').delete().eq('employee', name);
            await loadEmployees();
            await loadSchedulesFromCloud();
            renderEmployeeSelect();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        function renderEmployeeSelect() {
            const select = document.getElementById('employee-select-target');
            let html = '<option value="">-- 选择要管理的员工 (' + employees.length + '人) --</option>';
            employees.forEach(emp => {
                html += `<option value="${emp}">${emp}</option>`;
            });
            select.innerHTML = html;
        }

        // 岗位管理
        function loadShiftsLocal() {
            const saved = localStorage.getItem('workghost_custom_shifts_v2');
            if (saved) shifts = JSON.parse(saved);
        }
        function saveShiftsLocal() {
            localStorage.setItem('workghost_custom_shifts_v2', JSON.stringify(shifts));
        }

        function addShifts() {
            const input = document.getElementById('new-shift-name');
            const intensity = document.getElementById('new-shift-intensity').value;
            const text = input.value.trim();
            if (!text) return;

            const names = text.split('\n').map(s => s.trim()).filter(s => s);
            names.forEach(name => {
                if (!shifts.some(s => s.name === name)) {
                    shifts.push({ name, intensity });
                }
            });
            saveShiftsLocal();
            input.value = '';
            renderShiftList();
            renderTable();
            alert('成功添加岗位！');
        }

        function removeShift(name) {
            if (name === '休') { alert('「休」为必要选项，无法删除！'); return; }
            if (!confirm(`确定删除岗位「${name}」？`)) return;
            shifts = shifts.filter(s => s.name !== name);
            saveShiftsLocal();
            renderShiftList();
            renderTable();
        }

        function renderShiftList() {
            const container = document.getElementById('shift-list-container');
            let html = '';
            shifts.forEach(s => {
                const bg = s.intensity === '高' ? 'bg-rose-50 border-rose-200 text-rose-700' : (s.intensity === '中' ? 'bg-amber-50 border-amber-200 text-amber-700' : 'bg-emerald-500 text-white');
                html += `<span class="${bg} border px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1.5 shadow-sm">
                    <span>${s.intensity === '高' ? '🔴' : (s.intensity === '中' ? '🟡' : '🟢')} ${s.name}</span>
                    ${s.name !== '休' ? `<button onclick="removeShift('${s.name}')" class="font-bold ml-1 hover:text-black">×</button>` : ''}
                </span>`;
            });
            container.innerHTML = html;
        }

        // 读取与储存排班资料
        async function loadSchedulesFromCloud() {
            const monthKey = document.getElementById('month-select').value;
            const { data } = await _supabase.from('schedules').select('*').eq('month_key', monthKey);
            currentSchedules = {};
            if (data) {
                data.forEach(item => {
                    currentSchedules[`${item.employee}_${item.date_str}`] = item.shift;
                });
            }
        }

        function renderTable() {
            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            document.getElementById('table-title').innerText = `📊 ${year}年${month}月 排班工作表预览`;

            const table = document.getElementById('schedule-table');
            if (employees.length === 0) {
                table.innerHTML = '<tr><td colspan="32" class="text-center py-12 text-slate-400 text-sm">请先上方添加员工，即可开始排班！</td></tr>';
                return;
            }

            let html = '';
            html += '<thead><tr class="bg-slate-100 border-b border-slate-200 text-xs text-slate-600 uppercase tracking-wider">';
            html += '<th class="p-3 sticky left-0 bg-slate-100 z-10 w-28">员工姓名</th>';
            for (let d = 1; d <= daysInMonth; d++) {
                html += `<th class="p-2 text-center min-w-[55px]">${d}日</th>`;
            }
            html += '</tr></thead>';

            html += '<tbody class="divide-y divide-slate-100 text-sm">';
            employees.forEach(emp => {
                html += `<tr class="hover:bg-slate-50/50">`;
                html += `<td class="p-3 font-semibold text-slate-800 sticky left-0 bg-white z-10 shadow-sm">${emp}</td>`;

                for (let d = 1; d <= daysInMonth; d++) {
                    const dayStr = String(d).padStart(2, '0');
                    const dateStr = `${monthKey}-${dayStr}`;
                    const key = `${emp}_${dateStr}`;
                    const shift = currentSchedules[key] || '';
                    
                    const isLocked = (shift === '休(固定)' || shift === '休');

                    if (isLocked) {
                        html += `<td class="p-2 text-center bg-rose-50 text-rose-700 font-bold text-xs whitespace-nowrap" title="云端读取之员工休假，无法更改">🔒 休</td>`;
                    } else {
                        html += `<td class="p-2 text-center">
                            <select onchange="handleShiftChange('${emp}', '${dateStr}', this.value)" class="w-full text-center bg-transparent border border-slate-200 rounded p-1 text-xs focus:ring-2 focus:ring-indigo-500">
                                <option value="" ${shift === '' ? 'selected' : ''}>-</option>`;
                        shifts.forEach(s => {
                            const selected = (shift === s.name) ? 'selected' : '';
                            html += `<option value="${s.name}" ${selected}>${s.name}</option>`;
                        });
                        html += `</select></td>`;
                    }
                }
                html += `</tr>`;
            });
            html += '</tbody>';
            table.innerHTML = html;
        }

        async function handleShiftChange(employee, dateStr, shift) {
            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('同步中...', 'bg-amber-500 text-white');

            if (shift === '') {
                await _supabase.from('schedules').delete().match({ employee: employee, date_str: dateStr });
                delete currentSchedules[`${employee}_${dateStr}`];
            } else {
                const { error } = await _supabase.from('schedules').upsert([
                    { month_key: monthKey, employee: employee, date_str: dateStr, shift: shift }
                ], { onConflict: 'employee,date_str' });

                if (error) { alert('储存失败: ' + error.message); return; }
                currentSchedules[`${employee}_${dateStr}`] = shift;
            }
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        // 核心：抓取云端假表连结，自动过滤并读取网页中已输入的员工姓名休假
        async function importCloudLeaves() {
            const rawUrl = document.getElementById('cloud-sheet-url').value.trim();
            if (!rawUrl) { alert('请先贴上云端假表连结！'); return; }
            if (employees.length === 0) { alert('请先上方添加员工名单！'); return; }

            // 将 Google Sheets 连结转换为 CSV 汇出格式以供网页直接读取
            let csvUrl = rawUrl;
            if (rawUrl.includes('/edit')) {
                csvUrl = rawUrl.split('/edit')[0] + '/export?format=csv';
            }

            updateSyncStatus('读取云端假表中...', 'bg-amber-500 text-white');

            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('无法读取该连结，请确认该 Google 试算表权限是否已设为「知道连结的人都能检视」！');
                const csvText = await response.text();
                
                const lines = csvText.split('\n');
                const monthKey = document.getElementById('month-select').value;
                const [year, month] = monthKey.split('-').map(Number);
                const daysInMonth = new Date(year, month, 0).getDate();

                let batchData = [];
                let matchCount = 0;

                lines.forEach(line => {
                    // 简单的 CSV 解析
                    const cols = line.split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
                    if (cols.length < 2) return;

                    const rowName = cols[0];
                    // **关键逻辑：只读取网页上已输入的员工名字**
                    if (employees.includes(rowName)) {
                        matchCount++;
                        // 从第 2 个栏位开始对应日期（1号到31号）
                        for (let d = 1; d <= daysInMonth; d++) {
                            // 寻找对应日期的栏位值（假设表格结构为 姓名, 日1, 日2... 或包含日期标题）
                            // 检查有填数字（如 1）或标注休假的格子
                            const cellVal = cols[d] !== undefined ? cols[d] : '';
                            if (cellVal !== '' && (cellVal === '1' || cellVal.includes('休') || cellVal.toLowerCase() === 'true')) {
                                const dayStr = String(d).padStart(2, '0');
                                const dateStr = `${monthKey}-${dayStr}`;
                                batchData.push({
                                    month_key: monthKey,
                                    employee: rowName,
                                    date_str: dateStr,
                                    shift: '休(固定)'
                                });
                            }
                        }
                    }
                });

                if (batchData.length === 0) {
                    alert(`成功比对到 ${matchCount} 位员工，但在表格中未找到休假标记！请确认表格中的休假是用「1」或其他标记标示。`);
                    updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
                    return;
                }

                const { error } = await _supabase.from('schedules').upsert(batchData, { onConflict: 'employee,date_str' });
                if (error) { alert('写入假表失败: ' + error.message); return; }

                await loadSchedulesFromCloud();
                renderTable();
                updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
                alert(`成功抓取云端假表！已为网页中存在的员工锁定 ${batchData.length} 笔休假。`);

            } catch (err) {
                alert('抓取失败: ' + err.message + '\n\n提示：请确认 Google 试算表已开启共用权限（知道连结即可检视）。');
                updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            }
        }

        async function autoSchedule() {
            if (employees.length === 0) { alert('请先添加至少一位员工！'); return; }
            if (shifts.length <= 1) { alert('请先添加岗位！'); return; }
            if (!confirm('确定要执行一键智能排班吗？')) return;

            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            updateSyncStatus('排班运算中...', 'bg-amber-500 text-white');

            let batchData = [];
            const availableShifts = shifts.filter(s => s.name !== '休').map(s => s.name);

            employees.forEach((emp, index) => {
                for (let d = 1; d <= daysInMonth; d++) {
                    const dayStr = String(d).padStart(2, '0');
                    const dateStr = `${monthKey}-${dayStr}`;
                    const key = `${emp}_${dateStr}`;
                    
                    if (currentSchedules[key] === '休(固定)' || currentSchedules[key] === '休') continue; // 保留员工自排假

                    const assignedShift = availableShifts[(d + index) % availableShifts.length];
                    batchData.push({ month_key: monthKey, employee: emp, date_str: dateStr, shift: assignedShift });
                }
            });

            const { error } = await _supabase.from('schedules').upsert(batchData, { onConflict: 'employee,date_str' });
            if (error) { alert('排班失败: ' + error.message); return; }

            await loadSchedulesFromCloud();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert('一键智能排班完成！');
        }

        async function clearMonthLeaves() {
            if (!confirm('确定要清空当月所有员工的休假记录吗？')) return;
            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('清空中...', 'bg-rose-500 text-white');

            const { error } = await _supabase.from('schedules').delete().eq('month_key', monthKey).eq('shift', '休(固定)');
            if (error) { alert('清空失败: ' + error.message); return; }

            await loadSchedulesFromCloud();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert('当月休假已全数清空！');
        }

        async function clearMonthData() {
            if (!confirm('警告：确定要清空当月所有的排班与假表资料吗？')) return;
            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('清空中...', 'bg-rose-500 text-white');

            const { error } = await _supabase.from('schedules').delete().eq('month_key', monthKey);
            if (error) { alert('清空失败: ' + error.message); return; }

            currentSchedules = {};
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert('当月所有资料已清空！');
        }

        document.getElementById('month-select').addEventListener('change', async () => {
            await loadSchedulesFromCloud();
            renderTable();
        });

        init();
    </script>
</body>
</html>
