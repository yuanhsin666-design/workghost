<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能动态排班管理设置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <header class="bg-indigo-600 text-white shadow rounded-2xl p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">⚙️</span>
                <div>
                    <h1 class="text-2xl font-bold">智能动态排班管理设置</h1>
                    <p class="text-xs text-indigo-200 mt-1">云端假表 ｜ 固定休假 ｜ 按人数套用岗位 ｜ 锁定保护</p>
                </div>
            </div>
            <div id="sync-status" class="text-xs bg-indigo-500 text-white px-4 py-2 rounded-full font-medium shadow-inner">
                🔄 连线同步中...
            </div>
        </header>

        <div class="bg-white shadow rounded-2xl p-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center border-b border-slate-100 pb-6">
                <div>
                    <label class="block font-bold text-slate-700 text-sm mb-1">📅 选择排班月份：</label>
                    <input type="month" id="month-select" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value="2026-10">
                </div>

                <div class="md:col-span-2">
                    <label class="block font-bold text-slate-700 text-sm mb-1">👥 员工管理：</label>
                    <div class="flex flex-wrap gap-2 items-center">
                        <input type="text" id="new-employee-name" placeholder="输入员工姓名..." class="border border-slate-300 rounded-xl px-3 py-2 text-sm w-48 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="addEmployee()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">添加</button>
                        <button onclick="removeSelectedEmployee()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition">移除选中</button>
                        <select id="employee-select-target" class="border border-slate-300 rounded-xl px-3 py-2 text-sm flex-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">-- 选择要管理的员工 --</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="space-y-2 border-b border-slate-100 pb-6">
                <label class="block font-bold text-slate-700 text-sm">📥 导入当前月份的云端假表连结 (Google Sheets)：</label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="cloud-sheet-url" placeholder="请贴上云端 Google Sheets 共用连结..." 
                        class="flex-1 border border-slate-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="importCloudLeaves()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm whitespace-nowrap">
                        🟢 抓取当月休假日
                    </button>
                    <button onclick="clearMonthLeaves()" class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm whitespace-nowrap">
                        🗑️ 清空当月休假
                    </button>
                </div>
                <p class="text-xs text-slate-400">💡 提示：请确保 Google 试算表已设为「知道连结的人都能检视」，且员工姓名与上方列表相符，休假格填入 **1**。</p>
            </div>

            <div class="space-y-3 border-t border-slate-100 pt-6">
                <label class="block font-bold text-slate-700 text-sm">📋 每日岗位组合设定（依当天上班人数自动套用）：</label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="number" id="combo-headcount" placeholder="人数" min="1" max="50" class="w-24 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="text" id="combo-shifts" placeholder="岗位（用逗号分隔），例如：AI,BUG,彩票,外接,团队" class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="saveCombo()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-xl text-sm font-medium transition whitespace-nowrap">新增 / 更新组合</button>
                </div>
                <div id="combo-list-container" class="space-y-2 pt-2"></div>
                <p class="text-xs text-slate-400">💡 排班时：当天上班人数 → 找最接近的组合 → 按日期轮流分配。人数超过组合时，多出的给「支援」。</p>
            </div>

            <div class="space-y-3 border-t border-slate-100 pt-6">
                <label class="block font-bold text-slate-700 text-sm">🔒 锁定管理：</label>
                <div class="flex flex-wrap gap-2 items-center">
                    <button onclick="lockAllMonth()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                        🔒 一键锁定整月
                    </button>
                    <button onclick="unlockAllMonth()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                        🔓 一键解锁整月
                    </button>
                    <button onclick="lockHistoryDates()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                        🕰️ 锁定历史日期（今天以前）
                    </button>
                    <span id="lock-stat" class="text-xs text-slate-500 ml-2">本月已锁定 0 格</span>
                </div>
                <p class="text-xs text-slate-400">💡 开启手动修改模式后，每个非固定休假的格子旁会有小锁图示，点它可单格锁定/解锁。锁定后完全冻结，智能排班也会跳过。</p>
            </div>

            <div class="flex flex-wrap gap-3 pt-2 items-center">
                <button onclick="autoSchedule()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">
                    ✨ 执行智能排班
                </button>
                <button onclick="toggleEditMode()" id="edit-mode-btn" class="bg-amber-500 hover:bg-amber-600 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">
                    ✍️ 开启手动修改
                </button>
                <button onclick="validateDuplicateShifts()" class="bg-cyan-600 hover:bg-cyan-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">
                    🔍 校验排班重复岗位
                </button>
                <button onclick="validateConsecutiveShifts()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">
                    ⚠️ 校验连排岗位
                </button>
                <button onclick="copyTable()" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">
                    📋 复制整表
                </button>
                <button onclick="clearMonthData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-5 py-2.5 rounded-xl text-sm font-medium transition ml-auto">
                    重置当月资料
                </button>
            </div>
        </div>

        <div class="bg-white shadow rounded-2xl p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                <h2 id="table-title" class="font-bold text-slate-800 text-lg">📊 排班工作表预览</h2>
                <span id="mode-tip" class="text-xs text-amber-600 font-medium">🔒 目前为检视模式（点选上方「开启手动修改」即可编辑）</span>
            </div>
            <div class="overflow-x-auto min-h-[400px]">
                <table id="schedule-table" class="w-full text-left border-collapse"></table>
            </div>
        </div>
    </div>

    <div id="modal-container" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 id="modal-title" class="font-bold text-slate-800 text-base">系统讯息</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">×</button>
            </div>
            <div id="modal-content" class="max-h-96 overflow-y-auto text-sm text-slate-700 space-y-2"></div>
            <div class="flex justify-end pt-2">
                <button onclick="closeModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium">关闭</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://untcdzgliocuplqifejc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_exIdFgcOJ3eIRXrahU5LAw_Tr_43AMw';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let employees = [];
        let combos = [];
        let currentSchedules = {};
        let lockedCells = new Set();
        let isEditMode = false;

        const CLOUD_URL_KEY = 'cloud_sheet_url';

        async function saveCloudUrl(url) {
            const { error } = await _supabase.from('settings').upsert(
                { key: CLOUD_URL_KEY, value: url, updated_at: new Date().toISOString() },
                { onConflict: 'key' }
            );
            if (error) console.error('储存失败:', error);
        }

        async function loadCloudUrl() {
            const { data, error } = await _supabase
                .from('settings').select('value').eq('key', CLOUD_URL_KEY).maybeSingle();
            if (error) { console.error('读取失败:', error); return ''; }
            return data ? data.value : '';
        }

        async function loadCombos() {
            const { data, error } = await _supabase.from('shift_combos').select('*').order('headcount', { ascending: true });
            if (error) { console.error('读取组合失败:', error); combos = []; return; }
            combos = (data || []).map(row => ({
                id: row.id,
                headcount: row.headcount,
                shifts: Array.isArray(row.shifts) ? row.shifts : JSON.parse(row.shifts || '[]')
            }));
        }

        async function saveCombo() {
            const hcInput = document.getElementById('combo-headcount');
            const shInput = document.getElementById('combo-shifts');
            const hc = parseInt(hcInput.value, 10);
            const shiftText = shInput.value.trim();

            if (!hc || hc < 1) { alert('请输入正确的人数！'); return; }
            if (!shiftText) { alert('请输入岗位！'); return; }

            const shiftArr = shiftText.split(/[,，]/).map(s => s.trim()).filter(s => s);
            if (shiftArr.length === 0) { alert('岗位不能为空！'); return; }

            updateSyncStatus('同步中...', 'bg-amber-500 text-white');
            const { error } = await _supabase.from('shift_combos').upsert(
                { headcount: hc, shifts: shiftArr, updated_at: new Date().toISOString() },
                { onConflict: 'headcount' }
            );
            if (error) { alert('储存失败: ' + error.message); updateSyncStatus('已同步云端', 'bg-emerald-500 text-white'); return; }

            hcInput.value = '';
            shInput.value = '';
            await loadCombos();
            renderComboList();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert(`已储存「${hc} 人上班」的组合！`);
        }

        async function deleteCombo(id, headcount) {
            if (!confirm(`确定删除「${headcount} 人上班」的组合吗？`)) return;
            updateSyncStatus('同步中...', 'bg-amber-500 text-white');
            const { error } = await _supabase.from('shift_combos').delete().eq('id', id);
            if (error) { alert('删除失败: ' + error.message); return; }
            await loadCombos();
            renderComboList();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        function editCombo(id) {
            const c = combos.find(x => x.id === id);
            if (!c) return;
            document.getElementById('combo-headcount').value = c.headcount;
            document.getElementById('combo-shifts').value = c.shifts.join(',');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderComboList() {
            const container = document.getElementById('combo-list-container');
            if (combos.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 italic">目前没有岗位组合，请上方新增。</p>';
                return;
            }
            let html = '';
            combos.forEach(c => {
                html += `<div class="flex flex-wrap items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                    <span class="bg-indigo-600 text-white text-xs font-bold px-2 py-1 rounded">${c.headcount} 人</span>
                    <span class="text-sm text-slate-700 flex-1">${c.shifts.join(' , ')}</span>
                    <button onclick="editCombo(${c.id})" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">编辑</button>
                    <button onclick="deleteCombo(${c.id}, ${c.headcount})" class="text-xs text-rose-600 hover:text-rose-800 font-medium">删除</button>
                </div>`;
            });
            container.innerHTML = html;
        }

       function getAllShiftNames() {
            const set = new Set();
            combos.forEach(c => c.shifts.forEach(s => set.add(s)));
            set.add('休');
            return Array.from(set);
        }

        function findClosestCombo(headcount) {
            if (combos.length === 0) return null;
            const exact = combos.find(c => c.headcount === headcount);
            if (exact) return exact;
            let best = combos[0];
            let bestDiff = Math.abs(combos[0].headcount - headcount);
            combos.forEach(c => {
                const diff = Math.abs(c.headcount - headcount);
                if (diff < bestDiff) { best = c; bestDiff = diff; }
            });
            return best;
        }

        function lockKey(emp, dateStr) { return `${emp}_${dateStr}`; }
        function isLocked(emp, dateStr) { return lockedCells.has(lockKey(emp, dateStr)); }

        async function loadLockedCells() {
            const monthKey = document.getElementById('month-select').value;
            const { data, error } = await _supabase
                .from('locked_cells').select('employee, date_str').eq('month_key', monthKey);
            lockedCells = new Set();
            if (error) { console.error('读取锁定失败:', error); return; }
            (data || []).forEach(row => lockedCells.add(lockKey(row.employee, row.date_str)));
            updateLockStat();
        }

        function updateLockStat() {
            const el = document.getElementById('lock-stat');
            if (el) el.innerText = `本月已锁定 ${lockedCells.size} 格`;
        }

        async function lockCell(emp, dateStr, reason = 'manual') {
            const monthKey = document.getElementById('month-select').value;
            const { error } = await _supabase.from('locked_cells').upsert(
                { month_key: monthKey, employee: emp, date_str: dateStr, reason: reason },
                { onConflict: 'employee,date_str' }
            );
            if (error) { alert('锁定失败: ' + error.message); return; }
            lockedCells.add(lockKey(emp, dateStr));
            updateLockStat();
            renderTable();
        }

        async function unlockCell(emp, dateStr) {
            const { error } = await _supabase.from('locked_cells')
                .delete().match({ employee: emp, date_str: dateStr });
            if (error) { alert('解锁失败: ' + error.message); return; }
            lockedCells.delete(lockKey(emp, dateStr));
            updateLockStat();
            renderTable();
        }

        async function toggleLockCell(emp, dateStr) {
            if (isLocked(emp, dateStr)) await unlockCell(emp, dateStr);
            else await lockCell(emp, dateStr, 'manual');
        }

        async function lockAllMonth() {
            if (employees.length === 0) { alert('请先添加员工！'); return; }
            if (!confirm(`确定锁定本月所有格子？（${employees.length} 人 × 整月）`)) return;

            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            updateSyncStatus('锁定中...', 'bg-amber-500 text-white');
            const batch = [];
            employees.forEach(emp => {
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${monthKey}-${String(d).padStart(2, '0')}`;
                    batch.push({ month_key: monthKey, employee: emp, date_str: dateStr, reason: 'all_month' });
                }
            });

            const dedupMap = new Map();
            batch.forEach(item => dedupMap.set(`${item.employee}_${item.date_str}`, item));
            const dedupData = Array.from(dedupMap.values());

            const { error } = await _supabase.from('locked_cells').upsert(dedupData, { onConflict: 'employee,date_str' });
            if (error) { alert('锁定失败: ' + error.message); return; }

            await loadLockedCells();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert(`已锁定 ${dedupData.length} 格！`);
        }
        // 点日期表头：切换那天全部锁定/解锁
        async function toggleLockDay(dateStr) {
            if (employees.length === 0) { alert('请先添加员工！'); return; }

            // 检查这天是否「全锁」
            const lockedCount = employees.filter(emp => isLocked(emp, dateStr)).length;
            const total = employees.length;
            const allLocked = (lockedCount === total);

            if (allLocked) {
                // 全锁 → 解开那天全部
                if (!confirm(`确定解锁 ${dateStr} 这天所有员工的锁定吗？`)) return;
                updateSyncStatus('解锁中...', 'bg-amber-500 text-white');

                const { error } = await _supabase.from('locked_cells')
                    .delete().eq('date_str', dateStr);
                if (error) { alert('解锁失败: ' + error.message); return; }

                await loadLockedCells();
                renderTable();
                updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            } else {
                // 没全锁 → 锁全部
                if (!confirm(`确定锁定 ${dateStr} 这天全部 ${total} 位员工吗？`)) return;
                updateSyncStatus('锁定中...', 'bg-amber-500 text-white');

                const monthKey = document.getElementById('month-select').value;
                const batch = employees.map(emp => ({
                    month_key: monthKey,
                    employee: emp,
                    date_str: dateStr,
                    reason: 'day_lock'
                }));

                const { error } = await _supabase.from('locked_cells').upsert(batch, { onConflict: 'employee,date_str' });
                if (error) { alert('锁定失败: ' + error.message); return; }

                await loadLockedCells();
                renderTable();
                updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            }
        }
        async function unlockAllMonth() {
            if (!confirm('确定解锁本月所有格子？')) return;
            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('解锁中...', 'bg-amber-500 text-white');
            const { error } = await _supabase.from('locked_cells').delete().eq('month_key', monthKey);
            if (error) { alert('解锁失败: ' + error.message); return; }
            await loadLockedCells();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert('本月所有锁定已解除！');
        }

        async function lockHistoryDates() {
            if (employees.length === 0) { alert('请先添加员工！'); return; }
            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const pastDays = [];
            for (let d = 1; d <= daysInMonth; d++) {
                const dt = new Date(year, month - 1, d);
                dt.setHours(0, 0, 0, 0);
                if (dt < today) pastDays.push(d);
            }

            if (pastDays.length === 0) { alert('本月没有「今天以前」的日期。'); return; }
            if (!confirm(`确定锁定本月 ${pastDays.length} 天（今天以前）所有格子？`)) return;

            updateSyncStatus('锁定中...', 'bg-amber-500 text-white');
            const batch = [];
            employees.forEach(emp => {
                pastDays.forEach(d => {
                    const dateStr = `${monthKey}-${String(d).padStart(2, '0')}`;
                    batch.push({ month_key: monthKey, employee: emp, date_str: dateStr, reason: 'history' });
                });
            });

            const dedupMap = new Map();
            batch.forEach(item => dedupMap.set(`${item.employee}_${item.date_str}`, item));
            const dedupData = Array.from(dedupMap.values());

            const { error } = await _supabase.from('locked_cells').upsert(dedupData, { onConflict: 'employee,date_str' });
            if (error) { alert('锁定失败: ' + error.message); return; }

            await loadLockedCells();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert(`已锁定历史日期：${dedupData.length} 格。`);
        }

        async function init() {
            updateSyncStatus('连线中...', 'bg-amber-500 text-white');
            await loadEmployees();
            await loadCombos();
            await loadSchedulesFromCloud();
            await loadLockedCells();

            const savedUrl = await loadCloudUrl();
            if (savedUrl) document.getElementById('cloud-sheet-url').value = savedUrl;

            renderEmployeeSelect();
            renderComboList();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        function updateSyncStatus(text, className) {
            const badge = document.getElementById('sync-status');
            badge.className = `text-xs px-3 py-1.5 rounded-full font-medium shadow-inner ${className}`;
            badge.innerText = text;
        }

        async function loadEmployees() {
            const { data } = await _supabase.from('employees').select('*').order('created_at', { ascending: true });
            employees = data ? data.map(item => item.name) : [];
        }

        async function addEmployee() {
            const input = document.getElementById('new-employee-name');
            const name = input.value.trim();
            if (!name) return;
            if (employees.includes(name)) { alert('员工已存在！'); return; }
            updateSyncStatus('同步中...', 'bg-amber-500 text-white');
            await _supabase.from('employees').insert([{ name }]);
            input.value = '';
            await loadEmployees();
            renderEmployeeSelect();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        async function removeSelectedEmployee() {
            const select = document.getElementById('employee-select-target');
            const name = select.value;

               async function handleShiftChange(employee, dateStr, shift) {
            const key = `${employee}_${dateStr}`;
            const existing = currentSchedules[key];

            if (isLocked(employee, dateStr)) {
                alert('此格已锁定，无法修改。请先解锁。');
                renderTable();
                return;
            }

            if (isFixedRest(existing) && shift !== '休' && shift !== '休(固定)' && shift !== '') {
                alert('此为公司固定休假，不可改为其他岗位。');
                renderTable();
                return;
            }

            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('同步中...', 'bg-amber-500 text-white');

            if (shift === '') {
                await _supabase.from('schedules').delete().match({ employee: employee, date_str: dateStr });
                delete currentSchedules[key];
            } else {
                const { error } = await _supabase.from('schedules').upsert([
                    { month_key: monthKey, employee: employee, date_str: dateStr, shift: shift }
                ], { onConflict: 'employee,date_str' });
                if (error) { alert('储存失败: ' + error.message); return; }
                currentSchedules[key] = shift;
            }
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            renderTable();
        }

               function validateDuplicateShifts() {
            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();
            let issues = [];

            // ===== 检查 1 & 2：同天同岗位人数 =====
            let moreThan2 = [];
            let sameDayDup = [];

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${monthKey}-${String(d).padStart(2, '0')}`;
                const shiftCount = {};
                employees.forEach(emp => {
                    const shift = currentSchedules[`${emp}_${dateStr}`];
                    if (shift && !isFixedRest(shift)) {
                        if (!shiftCount[shift]) shiftCount[shift] = [];
                        shiftCount[shift].push(emp);
                    }
                });

                Object.keys(shiftCount).forEach(s => {
                    const list = shiftCount[s];
                    if (list.length > 2) {
                        moreThan2.push(`📅 ${month}月${d}日：**[${s}]** 有 ${list.length} 人（${list.join(', ')}）`);
                    }
                    if (list.length >= 2 && list.length <= 2) {
                        sameDayDup.push(`📅 ${month}月${d}日：**[${s}]** 有 2 人（${list.join(', ')}）`);
                    }
                });
            }

            // ===== 检查 3：同一员工，同岗位连续太多天 =====
            let consecutiveSame = [];
            employees.forEach(emp => {
                let lastShift = null;
                let runLength = 0;
                let runStart = 0;
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${monthKey}-${String(d).padStart(2, '0')}`;
                    const rawShift = currentSchedules[`${emp}_${dateStr}`] || '';
                    const shift = isFixedRest(rawShift) ? '' : rawShift;

                    if (shift && shift === lastShift) {
                        runLength++;
                        if (runLength >= 3) {
                            // 已经连续 3 天以上，只在「刚好达到 3 的倍数」时记录一次，避免重复
                            if (runLength === 3) {
                                consecutiveSame.push(`⚠️ **${emp}** 自 ${d - 2}日 起连续做 **[${shift}]**`);
                            }
                        }
                    } else {
                        lastShift = shift || null;
                        runLength = 1;
                        runStart = d;
                    }
                }
            });

            // ===== 检查 4：人数 vs 岗位组合是否对得上 =====
            let comboMismatch = [];
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${monthKey}-${String(d).padStart(2, '0')}`;

                // 当天上班人数（没休 + 没锁 之外，实际有排岗位的才算）
                const workingEmps = employees.filter(emp => {
                    const key = `${emp}_${dateStr}`;
                    return !isFixedRest(currentSchedules[key]);
                });

                if (workingEmps.length === 0) continue;

                // 当天实际有岗位的人
                const assignedEmps = workingEmps.filter(emp => {
                    const shift = currentSchedules[`${emp}_${dateStr}`] || '';
                    return shift && !isFixedRest(shift);
                });

                const combo = findClosestCombo(workingEmps.length);
                if (!combo) {
                    comboMismatch.push(`📅 ${month}月${d}日：上班 ${workingEmps.length} 人，但**没有任何岗位组合**`);
                    continue;
                }

                // 人数 vs 组合人数
                if (workingEmps.length !== combo.headcount) {
                    comboMismatch.push(`📅 ${month}月${d}日：上班 ${workingEmps.length} 人，套用「${combo.headcount} 人」组合（最接近）`);
                }

                // 组合岗位数 vs 实际有岗位人数
                if (assignedEmps.length < combo.shifts.length) {
                    const empty = workingEmps.length - assignedEmps.length;
                    if (empty > 0) {
                        comboMismatch.push(`📅 ${month}月${d}日：${workingEmps.length} 人上班，但只有 ${assignedEmps.length} 人有岗位（${empty} 人空着）`);
                    }
                }
            }

            // ===== 组合结果 =====
            let finalIssues = [];

            if (moreThan2.length > 0) {
                finalIssues.push(`<div class="font-bold text-rose-700 mb-1">🔴 检查 1：同一天同岗位 >2 人（${moreThan2.length} 笔）</div>`);
                finalIssues.push(...moreThan2);
            }
            if (sameDayDup.length > 0) {
                finalIssues.push(`<div class="font-bold text-amber-700 mt-3 mb-1">🟡 检查 2：同一天同岗位刚好 2 人（${sameDayDup.length} 笔）</div>`);
                finalIssues.push(...sameDayDup);
            }
            if (consecutiveSame.length > 0) {
                finalIssues.push(`<div class="font-bold text-orange-700 mt-3 mb-1">🟠 检查 3：同员工连续 ≥3 天同岗位（${consecutiveSame.length} 笔）</div>`);
                finalIssues.push(...consecutiveSame);
            }
            if (comboMismatch.length > 0) {
                finalIssues.push(`<div class="font-bold text-blue-700 mt-3 mb-1">🔵 检查 4：人数 vs 组合对不上（${comboMismatch.length} 笔）</div>`);
                finalIssues.push(...comboMismatch);
            }

            if (finalIssues.length === 0) {
                showModal('🔍 排班校验结果', ['✨ 太棒了！4 项检查全部通过。']);
                return;
            }

            // 统计
            const summary = `共侦测 ${moreThan2.length + sameDayDup.length + consecutiveSame.length + comboMismatch.length} 笔异常`;
            showModal('🔍 排班校验结果（' + summary + '）', finalIssues);
        }
                
        function validateConsecutiveShifts() {
            let issues = [];
            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            employees.forEach(emp => {
                let consecutiveDays = 0;
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${monthKey}-${String(d).padStart(2, '0')}`;
                    const shift = currentSchedules[`${emp}_${dateStr}`] || '';
                    if (shift && !isFixedRest(shift)) {
                        consecutiveDays++;
                        if (consecutiveDays >= 5) {
                            issues.push(`⚠️ 员工 **${emp}** 自 ${d - consecutiveDays + 1}日 至 ${d}日 已**连续上班 ${consecutiveDays} 天**。`);
                        }
                    } else {
                        consecutiveDays = 0;
                    }
                }
            });
            showModal('⚠️ 连排岗位/过劳校验结果', issues.length > 0 ? issues : ['✨ 所有员工的连续排班天数均在合理范围内。']);
        }

        async function importCloudLeaves() {
            const rawUrl = document.getElementById('cloud-sheet-url').value.trim();
            if (!rawUrl) { alert('请先贴上云端假表连结！'); return; }
            if (employees.length === 0) { alert('请先添加员工！'); return; }

            await saveCloudUrl(rawUrl);

            let csvUrl = rawUrl;
            const idMatch = rawUrl.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
            if (idMatch) {
                const sheetId = idMatch[1];
                const gidMatch = rawUrl.match(/[#&?]gid=([0-9]+)/);
                const gid = gidMatch ? gidMatch[1] : '0';
                csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;
            }

            updateSyncStatus('读取云端假表中...', 'bg-amber-500 text-white');

            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('无法读取，请确认权限为「知道连结的人都能检视」！');
                const csvText = await response.text();

                const rows = csvText.split(/\r?\n/).map(line => {
                    const result = [];
                    let inQuotes = false, current = '';
                    for (let i = 0; i < line.length; i++) {
                        const c = line[i];
                        if (c === '"') { inQuotes = !inQuotes; }
                        else if (c === ',' && !inQuotes) { result.push(current); current = ''; }
                        else { current += c; }
                    }
                    result.push(current);
                    return result.map(s => s.trim().replace(/^["']|["']$/g, ''));
                });

                const monthKey = document.getElementById('month-select').value;
                const [year, month] = monthKey.split('-').map(Number);
                const daysInMonth = new Date(year, month, 0).getDate();

                const normalize = (s) => String(s || '')
                    .replace(/[\s\u3000]/g, '')
                    .replace(/[()（）\[\]【】]/g, '')
                    .toLowerCase();

                const empNormMap = {};
                employees.forEach(e => { empNormMap[normalize(e)] = e; });

                const dayColMap = {};
                for (let r = 0; r < Math.min(rows.length, 10); r++) {
                    const row = rows[r];
                    const dayCells = [];
                    row.forEach((cell, cIdx) => {
                        if (!cell) return;
                        const clean = cell.toString().replace(/[日号號\s]/g, '').trim();
                        const num = parseInt(clean, 10);
                        if (!isNaN(num) && num >= 1 && num <= 31 && String(num) === clean) {
                            dayCells.push({ cIdx, num });
                        }
                    });
                    if (dayCells.length >= 25) {
                        dayCells.forEach(({ cIdx, num }) => { dayColMap[cIdx] = num; });
                        break;
                    }
                }

                if (Object.keys(dayColMap).length === 0) {
                    showModal('❌ 找不到日期表头', ['请确认试算表第 2 列是纯数字 1~31，且至少 25 栏。']);
                    updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
                    return;
                }

                const empRowMap = {};
                rows.forEach((row, rIdx) => {
                    row.forEach((cell) => {
                        const norm = normalize(cell);
                        if (!norm) return;
                        if (empNormMap[norm] && !empRowMap[rIdx]) {
                            empRowMap[rIdx] = empNormMap[norm];
                        }
                    });
                });

                const batchData = [];
                Object.keys(empRowMap).forEach(rIdx => {
                    const empName = empRowMap[rIdx];
                    const rowData = rows[rIdx] || [];
                    Object.keys(dayColMap).forEach(cIdx => {
                        const dayNum = dayColMap[cIdx];
                        if (dayNum < 1 || dayNum > daysInMonth) return;
                        const val = (rowData[cIdx] || '').toString().trim();
                        if (val === '1' || val === '１' || val.toLowerCase() === 'true' || val === '休') {
                            batchData.push({
                                month_key: monthKey,
                                employee: empName,
                                date_str: `${monthKey}-${String(dayNum).padStart(2, '0')}`,
                                shift: '休'
                            });
                        }
                    });
                });

                if (batchData.length === 0) {
                    showModal('⚠️ 未侦测到休假', ['请确认员工姓名一致，且休假格填 1。']);
                    updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
                    return;
                }

                const dedupMap = new Map();
                batchData.forEach(item => dedupMap.set(`${item.employee}_${item.date_str}`, item));
                const dedupData = Array.from(dedupMap.values());

                const { error } = await _supabase.from('schedules').upsert(dedupData, { onConflict: 'employee,date_str' });
                if (error) { alert('写入失败: ' + error.message); return; }

                await loadSchedulesFromCloud();
                renderTable();
                updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
                alert(`🎉 成功汇入 ${dedupData.length} 笔休假。`);

            } catch (err) {
                alert('抓取失败: ' + err.message);
                updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            }
        }

        async function autoSchedule() {
            if (employees.length === 0) { alert('请先添加员工！'); return; }
            if (combos.length === 0) { alert('请先新增岗位组合！'); return; }
            if (!confirm('确定执行智能排班？\n（固定休假与锁定格将会跳过）')) return;

            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            updateSyncStatus('读取最新资料...', 'bg-amber-500 text-white');
            await loadSchedulesFromCloud();
            await loadLockedCells();

            updateSyncStatus('排班运算中...', 'bg-amber-500 text-white');

            let batchData = [];
            const warnings = [];

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${monthKey}-${String(d).padStart(2, '0')}`;

                // 当天上班 = 没休 且 没锁定
                const workingEmps = employees.filter(emp => {
                    const key = `${emp}_${dateStr}`;
                    if (isFixedRest(currentSchedules[key])) return false;
                    if (isLocked(emp, dateStr)) return false;
                    return true;
                });

                if (workingEmps.length === 0) continue;

                const combo = findClosestCombo(workingEmps.length);
                if (!combo) continue;

                const offset = (d - 1) % combo.shifts.length;
                    workingEmps.forEach((emp, idx) => {
                    // 超过组合岗位数的人 → 留空（不排班）
                    if (idx >= combo.shifts.length) return;

                    const shift = combo.shifts[(idx + offset) % combo.shifts.length];
                    batchData.push({
                        month_key: monthKey,
                        employee: emp,
                        date_str: dateStr,
                        shift: shift
                    });
                });

                if (workingEmps.length !== combo.headcount) {
                    warnings.push(`${month}月${d}日：${workingEmps.length} 人，套用 ${combo.headcount} 人组合`);
                }
            }

            if (batchData.length === 0) {
                alert('没有可排班的资料。');
                updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
                return;
            }

            const dedupMap = new Map();
            batchData.forEach(item => dedupMap.set(`${item.employee}_${item.date_str}`, item));
            const dedupData = Array.from(dedupMap.values());

            const { error } = await _supabase.from('schedules').upsert(dedupData, { onConflict: 'employee,date_str' });
            if (error) { alert('排班失败: ' + error.message); return; }

            await loadSchedulesFromCloud();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');

            let msg = `智能排班完成！共 ${dedupData.length} 笔。\n（固定休假与锁定格已跳过）`;
            if (warnings.length > 0) {
                msg += `\n\n⚠️ ${warnings.length} 天人数与组合不完全符合：\n` + warnings.slice(0, 10).join('\n');
                if (warnings.length > 10) msg += `\n...还有 ${warnings.length - 10} 天`;
            }
            alert(msg);
        }

        async function clearMonthLeaves() {
            if (!confirm('确定清空当月所有休假？')) return;
            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('清空中...', 'bg-rose-500 text-white');
            const { error } = await _supabase.from('schedules').delete().eq('month_key', monthKey).eq('shift', '休');
            if (error) { alert('清空失败: ' + error.message); return; }
            await loadSchedulesFromCloud();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert('当月休假已清空！');
        }

        async function clearMonthData() {
            if (!confirm('警告：确定清空当月所有排班与假表？')) return;
            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('清空中...', 'bg-rose-500 text-white');
            const { error } = await _supabase.from('schedules').delete().eq('month_key', monthKey);
            if (error) { alert('清空失败: ' + error.message); return; }
            currentSchedules = {};
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert('当月资料已清空！');
        }
        // 📋 复制整表（Tab 分隔，贴到 Excel 自动分格）
        function copyTable() {
            if (employees.length === 0) { alert('没有员工可复制！'); return; }

            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            // 表头
            const header = ['员工姓名'];
            for (let d = 1; d <= daysInMonth; d++) header.push(`${d}日`);
            const lines = [header.join('\t')];

            // 每一行
            employees.forEach(emp => {
                const row = [emp];
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${monthKey}-${String(d).padStart(2, '0')}`;
                    const key = `${emp}_${dateStr}`;
                    const rawShift = currentSchedules[key] || '';
                    const displayShift = isFixedRest(rawShift) ? '休' : rawShift;
                    row.push(displayShift || '');
                }
                lines.push(row.join('\t'));
            });

            const text = lines.join('\n');

            // 复制到剪贴板
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showModal('📋 已复制整表', [
                        `已复制 ${employees.length} 位员工 × ${daysInMonth} 天的排班。`,
                        `请到 Excel / Google Sheets 打开新档，按 <strong>Ctrl+V</strong> 贴上，会自动分格。`,
                        `<details class="mt-2"><summary class="cursor-pointer text-xs text-slate-500">点此预览前 5 行</summary><pre class="mt-2 text-[10px] bg-white p-2 rounded border overflow-x-auto whitespace-pre">${lines.slice(0, 5).join('\n').replace(/</g, '&lt;')}</pre></details>`
                    ]);
                }).catch(err => {
                    // 剪贴板失败 → 用 fallback
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            // 开一个 textarea 让使用者手动复制
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                document.body.removeChild(ta);
                showModal('📋 已复制整表', ['请到 Excel / Google Sheets 按 Ctrl+V 贴上。']);
            } catch (e) {
                document.body.removeChild(ta);
                showModal('📋 请手动复制', [
                    '自动复制失败，请手动选取下方文字并复制：',
                    `<textarea class="w-full h-64 text-[10px] font-mono border rounded p-2 mt-2" onclick="this.select()">${text.replace(/</g, '&lt;')}</textarea>`
                ]);
            }
        }
        
        document.getElementById('month-select').addEventListener('change', async () => {
            await loadSchedulesFromCloud();
            await loadLockedCells();
            renderTable();
        });

        init();
    </script>
</body>
</html>
