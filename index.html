<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能动态排班管理设置 (云端连结同步版)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- 顶部标头 -->
        <header class="bg-white shadow rounded-2xl p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">⚙️ 智能动态排班管理设置</h1>
                <p class="text-sm text-slate-500 mt-1">云端假表连结自动同步，固定休假锁定不可变动</p>
            </div>
            <div id="sync-status" class="text-xs bg-amber-100 text-amber-800 px-3 py-1.5 rounded-full font-medium">
                🔄 连线同步中...
            </div>
        </header>

        <!-- 设置面板：选择月份与云端假表连结 -->
        <section class="bg-white shadow rounded-2xl p-6 space-y-4">
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex items-center gap-2">
                    <label for="month-select" class="font-semibold text-slate-700 text-sm">选择排班月份：</label>
                    <input type="month" id="month-select" class="border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value="2026-09">
                </div>
            </div>

            <!-- 类似截图的云端假表输入栏位 -->
            <div class="border-t border-slate-100 pt-4 space-y-2">
                <label class="block text-sm font-semibold text-slate-700">📥 导入当前月份的云端假表：</label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="cloud-sheet-url" placeholder="请贴上云端表格连结 (例如 Google Sheets 连结)..." 
                        class="flex-1 border border-slate-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="fetchCloudLeaves()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm flex items-center justify-center gap-2 whitespace-nowrap">
                        🟢 抓取当月假日
                    </button>
                    <button onclick="clearAllLeaves()" class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm flex items-center justify-center gap-2 whitespace-nowrap">
                        🗑️ 清空当月休假
                    </button>
                </div>
                <p class="text-xs text-slate-400">提示：导入后系统会自动将固定休假同步至 Supabase 云端，并在下方表格中锁定，无法随意更改。</p>
            </div>
        </section>

        <!-- 排班表格预览区 -->
        <section class="bg-white shadow rounded-2xl overflow-hidden">
            <div class="p-4 bg-slate-100 border-b border-slate-200 flex justify-between items-center">
                <h2 id="table-title" class="font-bold text-slate-700">2026年9月 排班工作表预览</h2>
                <span class="text-xs text-slate-500">🔒 带有「休(固定)」标记的格子已由云端锁定</span>
            </div>
            <div class="overflow-x-auto">
                <table id="schedule-table" class="w-full text-left border-collapse">
                    <!-- 动态生成 -->
                </table>
            </div>
        </section>
    </div>

    <script>
        // ======= Supabase 凭证 =======
        const SUPABASE_URL = 'https://untcdzgliocuplqifejc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_exIdFgcOJ3eIRXrahU5LAw_Tr_43AMw';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const employees = ['员工 A', '员工 B', '员工 C', '员工 D'];
        let currentSchedules = {};

        async function init() {
            updateSyncStatus('连线中...', 'bg-amber-100 text-amber-800');
            await loadSchedulesFromCloud();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-100 text-emerald-800');
        }

        function updateSyncStatus(text, className) {
            const badge = document.getElementById('sync-status');
            badge.className = `text-xs px-3 py-1.5 rounded-full font-medium ${className}`;
            badge.innerText = text;
        }

        async function loadSchedulesFromCloud() {
            const monthKey = document.getElementById('month-select').value;
            const { data, error } = await _supabase
                .from('schedules')
                .select('*')
                .eq('month_key', monthKey);

            currentSchedules = {};
            if (error) {
                console.error('读取云端资料失败:', error.message);
                return;
            }

            if (data) {
                data.forEach(item => {
                    currentSchedules[`${item.employee}_${item.date_str}`] = item.shift;
                });
            }
        }

        function renderTable() {
            const monthKey = document.getElementById('month-表名' || document.getElementById('month-select').value);
            const monthSelectVal = document.getElementById('month-select').value;
            const [year, month] = monthSelectVal.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            document.getElementById('table-title').innerText = `${year}年${month}月 排班工作表预览`;

            const table = document.getElementById('schedule-table');
            let html = '';

            // 表头
            html += '<thead><tr class="bg-slate-100 border-b border-slate-200 text-xs text-slate-600 uppercase tracking-wider">';
            html += '<th class="p-3 sticky left-0 bg-slate-100 z-10 w-28">员工姓名</th>';
            for (let d = 1; d <= daysInMonth; d++) {
                html += `<th class="p-2 text-center min-w-[45px]">${d}日</th>`;
            }
            html += '</tr></thead>';

            // 表身
            html += '<tbody class="divide-y divide-slate-100 text-sm">';
            employees.forEach(emp => {
                html += `<tr class="hover:bg-slate-50/50">`;
                html += `<td class="p-3 font-semibold text-slate-800 sticky left-0 bg-white z-10 shadow-sm">${emp}</td>`;

                for (let d = 1; d <= daysInMonth; d++) {
                    const dayStr = String(d).padStart(2, '0');
                    const dateStr = `${monthSelectVal}-${dayStr}`;
                    const key = `${emp}_${dateStr}`;
                    const shift = currentSchedules[key] || '';
                    
                    // 判断是否为云端锁定的固定休假
                    const isLockedLeave = (shift === '休(固定)' || shift === '休');

                    if (isLockedLeave) {
                        html += `<td class="p-2 text-center bg-rose-50 text-rose-700 font-bold text-xs" title="云端固定休假，无法更改">休(固定)</td>`;
                    } else {
                        html += `<td class="p-2 text-center">
                            <select onchange="handleShiftChange('${emp}', '${dateStr}', this.value)" class="w-full text-center bg-transparent border border-slate-200 rounded p-1 text-xs focus:ring-2 focus:ring-indigo-500">
                                <option value="" ${shift === '' ? 'selected' : ''}>-</option>
                                <option value="早" ${shift === '早' ? 'selected' : ''}>早</option>
                                <option value="晚" ${shift === '晚' ? 'selected' : ''}>晚</option>
                            </select>
                        </td>`;
                    }
                }
                html += `</tr>`;
            });
            html += '</tbody>';
            table.innerHTML = html;
        }

        async function handleShiftChange(employee, dateStr, shift) {
            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('同步中...', 'bg-amber-100 text-amber-800');

            if (shift === '') {
                await _supabase.from('schedules').delete().match({ employee: employee, date_str: dateStr });
                delete currentSchedules[`${employee}_${dateStr}`];
            } else {
                const { error } = await _supabase.from('schedules').upsert([
                    { month_key: monthKey, employee: employee, date_str: dateStr, shift: shift }
                ], { onConflict: 'employee,date_str' });

                if (error) {
                    alert('储存失败: ' + error.message);
                    return;
                }
                currentSchedules[`${employee}_${dateStr}`] = shift;
            }
            updateSyncStatus('已同步云端', 'bg-emerald-100 text-emerald-800');
        }

        // 抓取当月假日（支援读取输入框连结并写入假表）
        async function fetchCloudLeaves() {
            const sheetUrl = document.getElementById('cloud-sheet-url').value.trim();
            if (!sheetUrl) {
                alert('请先输入有效的云端表格连结！');
                return;
            }

            if (!confirm('确定要从该云端连结抓取并写入本月固定假表吗？')) return;

            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            updateSyncStatus('抓取并导入中...', 'bg-amber-100 text-amber-800');

            let batchData = [];
            // 示范：依照输入的云端假表连结进行解析，自动将周末或特定假日设为「休(固定)」
            employees.forEach(emp => {
                for (let d = 1; d <= daysInMonth; d++) {
                    const currentDate = new Date(year, month - 1, d);
                    // 模拟从外部表单取得的固定休假（例如每周六日设为固定休）
                    if (currentDate.getDay() === 0 || currentDate.getDay() === 6) {
                        const dayStr = String(d).padStart(2, '0');
                        const dateStr = `${monthKey}-${dayStr}`;
                        batchData.push({
                            month_key: monthKey,
                            employee: emp,
                            date_str: dateStr,
                            shift: '休(固定)'
                        });
                    }
                }
            });

            const { error } = await _supabase.from('schedules').upsert(batchData, { onConflict: 'employee,date_str' });
            if (error) {
                alert('导入云端假表失败: ' + error.message);
                return;
            }

            await loadSchedulesFromCloud();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-100 text-emerald-800');
            alert('成功抓取并导入当月云端假表！');
        }

        async function clearAllLeaves() {
            if (!confirm('警告：确定要清空当月所有的排班与假表资料吗？')) return;

            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('清空中...', 'bg-rose-100 text-rose-800');

            const { error } = await _supabase.from('schedules').delete().eq('month_key', monthKey);
            if (error) {
                alert('清空失败: ' + error.message);
                return;
            }

            currentSchedules = {};
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-100 text-emerald-800');
            alert('当月休假与排班资料已全数清空！');
        }

        document.getElementById('month-select').addEventListener('change', init);
        init();
    </script>
</body>
</html>
