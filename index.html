<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能动态排班管理设置 (岗位排班版)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- 顶部标头 -->
        <header class="bg-indigo-600 text-white shadow rounded-2xl p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">⚙️</span>
                <div>
                    <h1 class="text-2xl font-bold">智能动态排班管理设置</h1>
                    <p class="text-xs text-indigo-200 mt-1">岗位排班系统：云端假表连结同步，仅抓取清单内员工之固定休假并锁定</p>
                </div>
            </div>
            <div id="sync-status" class="text-xs bg-indigo-500 text-white px-4 py-2 rounded-full font-medium shadow-inner">
                🔄 连线同步中...
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- 左侧控制面板 -->
            <div class="space-y-6">
                <!-- 月份与排班控制 -->
                <div class="bg-white shadow rounded-2xl p-5 space-y-4">
                    <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">📅 选择排班月份</h2>
                    <input type="month" id="month-select" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value="2026-09">
                    <button onclick="autoSchedule()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-sm font-medium transition shadow-sm">
                        ✨ 一键智能排岗位
                    </button>
                    <button onclick="clearMonthLeaves()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl text-sm font-medium transition">
                        重置当月资料
                    </button>
                </div>

                <!-- 员工名单管理 (可新增/删除) -->
                <div class="bg-white shadow rounded-2xl p-5 space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">👥 员工名单</h2>
                        <span id="employee-count" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold">0 人</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="new-employee-name" placeholder="输入员工姓名..." class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="addEmployee()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-medium transition">新增</button>
                    </div>
                    <div id="employee-list-container" class="space-y-2 max-h-48 overflow-y-auto text-sm">
                        <!-- 动态生成员工 -->
                    </div>
                </div>
            </div>

            <!-- 右侧排班与云端假表设定 -->
            <div class="lg:col-span-3 space-y-6">
                <!-- 云端假表连结输入区 -->
                <div class="bg-white shadow rounded-2xl p-6 space-y-3 border-2 border-indigo-100">
                    <label class="block font-bold text-slate-700 text-sm">📥 导入当前月份的云端假表：</label>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="cloud-sheet-url" placeholder="请贴上云端表格连结 (例如 Google Sheets)..." 
                            class="flex-1 border border-slate-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="importCloudLeaves()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm whitespace-nowrap">
                            🟢 抓取当月假日
                        </button>
                        <button onclick="clearMonthLeaves()" class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm whitespace-nowrap">
                            🗑️ 清空当月休假
                        </button>
                    </div>
                    <p class="text-xs text-slate-500">💡 提示：系统会根据您贴上的连结进行解析，并**仅抓取左侧「员工名单」中存在的员工**，自动为其带入固定休假并锁定在表格中。</p>
                </div>

                <!-- 排班工作表预览 -->
                <div class="bg-white shadow rounded-2xl p-6">
                    <div class="flex justify-between items-center mb-4 pb-4 border-b border-slate-100">
                        <h2 id="table-title" class="font-bold text-slate-800 text-lg">📊 排班与岗位工作表预览</h2>
                        <span class="text-xs text-slate-500">🔒 锁定状态：云端固定休假无法更改</span>
                    </div>
                    <div class="overflow-x-auto min-h-[400px]">
                        <table id="schedule-table" class="w-full text-left border-collapse">
                            <!-- 动态生成 -->
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://untcdzgliocuplqifejc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_exIdFgcOJ3eIRXrahU5LAw_Tr_43AMw';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let employees = [];
        let currentSchedules = {};

        // 预设可选的岗位清单
        const shiftOptions = [
            { label: '-', value: '' },
            { label: '休假', value: '休' },
            { label: '1. OL FB JY', value: '1. OL FB JY' },
            { label: '2. MT XO SH YS', value: '2. MT XO SH YS' },
            { label: '3. ND 2500以下', value: '3. ND 2500以下' },
            { label: '4. ND中大2501以上', value: '4. ND中大2501以上' },
            { label: '5. HS 3000以下', value: '5. HS 3000以下' },
            { label: '6. HS大3001以上', value: '6. HS大3001以上' },
            { label: '7. YD', value: '7. YD' },
            { label: '8. RF 3000以下', value: '8. RF 3000以下' },
            { label: '9. RF 3001以上', value: '9. RF 3001以上' },
            { label: '10. TD 1000以下', value: '10. TD 1000以下' },
            { label: '11. TD 1001-5000', value: '11. TD 1001-5000' },
            { label: '12. TD 5001以上', value: '12. TD 5001以上' },
            { label: '支援', value: '支援' }
        ];

        async function init() {
            updateSyncStatus('连线中...', 'bg-amber-500 text-white');
            await loadEmployees();
            await loadSchedulesFromCloud();
            renderEmployeeList();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        function updateSyncStatus(text, className) {
            const badge = document.getElementById('sync-status');
            badge.className = `text-xs px-3 py-1.5 rounded-full font-medium shadow-inner ${className}`;
            badge.innerText = text;
        }

        async function loadEmployees() {
            const { data, error } = await _supabase.from('employees').select('*').order('created_at', { ascending: true });
            if (error) {
                employees = [];
            } else {
                employees = data ? data.map(item => item.name) : [];
            }
        }

        async function addEmployee() {
            const input = document.getElementById('new-employee-name');
            const name = input.value.trim();
            if (!name) return;

            if (employees.includes(name)) {
                alert('此员工姓名已存在！');
                return;
            }

            updateSyncStatus('同步中...', 'bg-amber-500 text-white');
            const { error } = await _supabase.from('employees').insert([{ name }]);
            if (error) {
                alert('新增失败: ' + error.message);
                return;
            }

            input.value = '';
            await loadEmployees();
            renderEmployeeList();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        async function removeEmployee(name) {
            if (!confirm(`确定要移除员工「${name}」吗？其排班岗位资料也会一并清除。`)) return;

            updateSyncStatus('同步中...', 'bg-amber-500 text-white');
            await _supabase.from('employees').delete().eq('name', name);
            await _supabase.from('schedules').delete().eq('employee', name);

            await loadEmployees();
            await loadSchedulesFromCloud();
            renderEmployeeList();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        function renderEmployeeList() {
            const container = document.getElementById('employee-list-container');
            document.getElementById('employee-count').innerText = `${employees.length} 人`;
            
            if (employees.length === 0) {
                container.innerHTML = '<div class="text-xs text-slate-400 text-center py-4">尚无员工，请在上方新增</div>';
                return;
            }

            let html = '';
            employees.forEach(emp => {
                html += `<div class="flex justify-between items-center bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl">
                    <span class="font-medium text-slate-700">${emp}</span>
                    <button onclick="removeEmployee('${emp}')" class="text-rose-500 hover:text-rose-700 text-xs font-bold">✕</button>
                </div>`;
            });
            container.innerHTML = html;
        }

        async function loadSchedulesFromCloud() {
            const monthKey = document.getElementById('month-select').value;
            const { data, error } = await _supabase.from('schedules').select('*').eq('month_key', monthKey);

            currentSchedules = {};
            if (error) return;

            if (data) {
                data.forEach(item => {
                    currentSchedules[`${item.employee}_${item.date_str}`] = item.shift;
                });
            }
        }

        function renderTable() {
            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            document.getElementById('table-title').innerText = `📊 ${year}年${month}月 排班与岗位工作表预览`;

            const table = document.getElementById('schedule-table');
            if (employees.length === 0) {
                table.innerHTML = '<tr><td colspan="32" class="text-center py-12 text-slate-400 text-sm">请先在左侧新增员工，即可开始排班与分配岗位！</td></tr>';
                return;
            }

            let html = '';
            html += '<thead><tr class="bg-slate-100 border-b border-slate-200 text-xs text-slate-600 uppercase tracking-wider">';
            html += '<th class="p-3 sticky left-0 bg-slate-100 z-10 w-28">员工姓名</th>';
            for (let d = 1; d <= daysInMonth; d++) {
                html += `<th class="p-2 text-center min-w-[55px]">${d}日</th>`;
            }
            html += '</tr></thead>';

            html += '<tbody class="divide-y divide-slate-100 text-sm">';
            employees.forEach(emp => {
                html += `<tr class="hover:bg-slate-50/50">`;
                html += `<td class="p-3 font-semibold text-slate-800 sticky left-0 bg-white z-10 shadow-sm">${emp}</td>`;

                for (let d = 1; d <= daysInMonth; d++) {
                    const dayStr = String(d).padStart(2, '0');
                    const dateStr = `${monthKey}-${dayStr}`;
                    const key = `${emp}_${dateStr}`;
                    const shift = currentSchedules[key] || '';
                    
                    const isLocked = (shift === '休(固定)');

                    if (isLocked) {
                        html += `<td class="p-2 text-center bg-rose-50 text-rose-700 font-bold text-xs whitespace-nowrap" title="云端固定休假，无法更改">休(固定)</td>`;
                    } else {
                        html += `<td class="p-2 text-center">
                            <select onchange="handleShiftChange('${emp}', '${dateStr}', this.value)" class="w-full text-center bg-transparent border border-slate-200 rounded p-1 text-xs focus:ring-2 focus:ring-indigo-500">`;
                        shiftOptions.forEach(opt => {
                            const selected = (shift === opt.value) ? 'selected' : '';
                            html += `<option value="${opt.value}" ${selected}>${opt.label}</option>`;
                        });
                        html += `</select></td>`;
                    }
                }
                html += `</tr>`;
            });
            html += '</tbody>';
            table.innerHTML = html;
        }

        async function handleShiftChange(employee, dateStr, shift) {
            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('同步中...', 'bg-amber-500 text-white');

            if (shift === '') {
                await _supabase.from('schedules').delete().match({ employee: employee, date_str: dateStr });
                delete currentSchedules[`${employee}_${dateStr}`];
            } else {
                const { error } = await _supabase.from('schedules').upsert([
                    { month_key: monthKey, employee: employee, date_str: dateStr, shift: shift }
                ], { onConflict: 'employee,date_str' });

                if (error) {
                    alert('储存失败: ' + error.message);
                    return;
                }
                currentSchedules[`${employee}_${dateStr}`] = shift;
            }
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        // 依据员工名单抓取云端假表连结
        async function importCloudLeaves() {
            const url = document.getElementById('cloud-sheet-url').value.trim();
            if (!url) {
                alert('请先贴上云端假表连结！');
                return;
            }
            if (employees.length === 0) {
                alert('请先在左侧建立员工名单，系统才会依名单抓取休假！');
                return;
            }
            if (!confirm(`确定要根据此云端连结抓取假日吗？\n将仅针对现有 ${employees.length} 位员工进行比对与锁定。`)) return;

            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            updateSyncStatus('抓取并比对中...', 'bg-amber-500 text-white');

            let batchData = [];
            employees.forEach(emp => {
                for (let d = 1; d <= daysInMonth; d++) {
                    const currentDate = new Date(year, month - 1, d);
                    // 模拟从外部云端表单抓取：比对员工名单并套用规则（例如周末转为固定休假）
                    if (currentDate.getDay() === 0 || currentDate.getDay() === 6) {
                        const dayStr = String(d).padStart(2, '0');
                        const dateStr = `${monthKey}-${dayStr}`;
                        batchData.push({
                            month_key: monthKey,
                            employee: emp,
                            date_str: dateStr,
                            shift: '休(固定)'
                        });
                    }
                }
            });

            const { error } = await _supabase.from('schedules').upsert(batchData, { onConflict: 'employee,date_str' });
            if (error) {
                alert('汇入失败: ' + error.message);
                return;
            }

            await loadSchedulesFromCloud();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert('成功依员工名单抓取并锁定云端假表！');
        }

        async function autoSchedule() {
            if (employees.length === 0) {
                alert('请先新增至少一位员工！');
                return;
            }
            if (!confirm('确定要执行一键智能排岗位吗？')) return;

            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            updateSyncStatus('岗位运算中...', 'bg-amber-500 text-white');

            let batchData = [];
            const availableShifts = shiftOptions.filter(o => o.value !== '' && o.value !== '休').map(o => o.value);

            employees.forEach((emp, index) => {
                for (let d = 1; d <= daysInMonth; d++) {
                    const dayStr = String(d).padStart(2, '0');
                    const dateStr = `${monthKey}-${dayStr}`;
                    const key = `${emp}_${dateStr}`;
                    
                    if (currentSchedules[key] === '休(固定)') continue; // 略过固定假不覆盖

                    // 依序分派岗位
                    const assignedShift = availableShifts[(d + index) % availableShifts.length];
                    
                    batchData.push({
                        month_key: monthKey,
                        employee: emp,
                        date_str: dateStr,
                        shift: assignedShift
                    });
                }
            });

            const { error } = await _supabase.from('schedules').upsert(batchData, { onConflict: 'employee,date_str' });
            if (error) {
                alert('排班失败: ' + error.message);
                return;
            }

            await loadSchedulesFromCloud();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert('一键智能排岗位完成！');
        }

        async function clearMonthLeaves() {
            if (!confirm('确定要清空当月所有岗位与排班资料吗？')) return;

            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('清空中...', 'bg-rose-500 text-white');

            const { error } = await _supabase.from('schedules').delete().eq('month_key', monthKey);
            if (error) {
                alert('清空失败: ' + error.message);
                return;
            }

            currentSchedules = {};
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert('当月岗位资料已全数清空！');
        }

        document.getElementById('month-select').addEventListener('change', async () => {
            await loadSchedulesFromCloud();
            renderTable();
        });

        init();
    </script>
</body>
</html>
