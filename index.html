<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能动态排班管理设置 (表格贴上解析版)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- 顶部标头 -->
        <header class="bg-indigo-600 text-white shadow rounded-2xl p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">⚙️</span>
                <div>
                    <h1 class="text-2xl font-bold">智能动态排班管理设置</h1>
                    <p class="text-xs text-indigo-200 mt-1">支援贴上试算表假表，自动对应员工与日期锁定休假</p>
                </div>
            </div>
            <div id="sync-status" class="text-xs bg-indigo-500 text-white px-4 py-2 rounded-full font-medium shadow-inner">
                🔄 连线同步中...
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- 左侧控制面板 -->
            <div class="space-y-6">
                <!-- 月份与排班控制 -->
                <div class="bg-white shadow rounded-2xl p-5 space-y-4">
                    <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">📅 选择排班月份</h2>
                    <input type="month" id="month-select" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value="2026-10">
                    <button onclick="autoSchedule()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-sm font-medium transition shadow-sm">
                        ✨ 一键智能排班
                    </button>
                    <button onclick="clearMonthLeaves()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl text-sm font-medium transition">
                        重置当月资料
                    </button>
                </div>

                <!-- 员工名单管理 -->
                <div class="bg-white shadow rounded-2xl p-5 space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">👥 员工名单</h2>
                        <span id="employee-count" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold">0 人</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="new-employee-name" placeholder="输入员工姓名..." class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="addEmployee()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-medium transition">新增</button>
                    </div>
                    <div id="employee-list-container" class="space-y-2 max-h-40 overflow-y-auto text-sm">
                        <!-- 动态生成员工 -->
                    </div>
                </div>

                <!-- 岗位管理 (自建岗位) -->
                <div class="bg-white shadow rounded-2xl p-5 space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">🏷️ 岗位管理</h2>
                        <span id="shift-count" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold">0 个</span>
                    </div>
                    <div class="space-y-2">
                        <textarea id="new-shift-name" placeholder="输入岗位名称 (可换行输入多个)..." rows="2" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                        <button onclick="addShifts()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-sm font-medium transition">新增岗位</button>
                    </div>
                    <div id="shift-list-container" class="flex flex-wrap gap-1.5 max-h-40 overflow-y-auto text-xs">
                        <!-- 动态生成岗位 -->
                    </div>
                </div>
            </div>

            <!-- 右侧排班与云端假表设定 -->
            <div class="lg:col-span-3 space-y-6">
                <!-- 贴上假表区 -->
                <div class="bg-white shadow rounded-2xl p-6 space-y-3 border-2 border-indigo-100">
                    <label class="block font-bold text-slate-700 text-sm">📥 汇入员工自排假表（直接将 Excel / 网页表格复制并贴在下方）：</label>
                    <textarea id="paste-sheet-data" placeholder="请直接将试算表范围（包含姓名与 1~31 天的假表数据）复制并贴到这里..." rows="4" 
                        class="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono"></textarea>
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <p class="text-xs text-slate-500">💡 提示：从 Google Sheets 或 Excel 直接反白复制表格贴上即可，系统会自动抓取员工姓名与有填写数字的休假日期并锁定！</p>
                        <div class="flex gap-2">
                            <button onclick="importPastedLeaves()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm whitespace-nowrap">
                                🟢 解析并锁定假表
                            </button>
                            <button onclick="clearMonthLeaves()" class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm whitespace-nowrap">
                                🗑️ 清空当月休假
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 排班工作表预览 -->
                <div class="bg-white shadow rounded-2xl p-6">
                    <div class="flex justify-between items-center mb-4 pb-4 border-b border-slate-100">
                        <h2 id="table-title" class="font-bold text-slate-800 text-lg">📊 排班与岗位工作表预览</h2>
                        <span class="text-xs text-slate-500">🔒 锁定状态：员工自排休假无法更改</span>
                    </div>
                    <div class="overflow-x-auto min-h-[400px]">
                        <table id="schedule-table" class="w-full text-left border-collapse">
                            <!-- 动态生成 -->
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://untcdzgliocuplqifejc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_exIdFgcOJ3eIRXrahU5LAw_Tr_43AMw';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let employees = [];
        let shifts = ['休'];
        let currentSchedules = {};

        async function init() {
            updateSyncStatus('连线中...', 'bg-amber-500 text-white');
            await loadEmployees();
            await loadShifts();
            await loadSchedulesFromCloud();
            renderEmployeeList();
            renderShiftList();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        function updateSyncStatus(text, className) {
            const badge = document.getElementById('sync-status');
            badge.className = `text-xs px-3 py-1.5 rounded-full font-medium shadow-inner ${className}`;
            badge.innerText = text;
        }

        async function loadEmployees() {
            const { data } = await _supabase.from('employees').select('*').order('created_at', { ascending: true });
            employees = data ? data.map(item => item.name) : [];
        }

        async function addEmployee() {
            const input = document.getElementById('new-employee-name');
            const name = input.value.trim();
            if (!name) return;
            if (employees.includes(name)) { alert('员工已存在！'); return; }

            updateSyncStatus('同步中...', 'bg-amber-500 text-white');
            await _supabase.from('employees').insert([{ name }]);
            input.value = '';
            await loadEmployees();
            renderEmployeeList();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        async function removeEmployee(name) {
            if (!confirm(`确定移除员工「${name}」？`)) return;
            updateSyncStatus('同步中...', 'bg-amber-500 text-white');
            await _supabase.from('employees').delete().eq('name', name);
            await _supabase.from('schedules').delete().eq('employee', name);
            await loadEmployees();
            await loadSchedulesFromCloud();
            renderEmployeeList();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        function renderEmployeeList() {
            const container = document.getElementById('employee-list-container');
            document.getElementById('employee-count').innerText = `${employees.length} 人`;
            if (employees.length === 0) {
                container.innerHTML = '<div class="text-xs text-slate-400 text-center py-2">尚无员工</div>';
                return;
            }
            let html = '';
            employees.forEach(emp => {
                html += `<div class="flex justify-between items-center bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl">
                    <span class="font-medium text-slate-700">${emp}</span>
                    <button onclick="removeEmployee('${emp}')" class="text-rose-500 hover:text-rose-700 text-xs font-bold">✕</button>
                </div>`;
            });
            container.innerHTML = html;
        }

        async function loadShifts() {
            const saved = localStorage.getItem('workghost_custom_shifts');
            shifts = saved ? JSON.parse(saved) : ['休', '早班', '晚班', '支援'];
        }

        function saveShifts() {
            localStorage.setItem('workghost_custom_shifts', JSON.stringify(shifts));
        }

        function addShifts() {
            const input = document.getElementById('new-shift-name');
            const text = input.value.trim();
            if (!text) return;
            const newItems = text.split('\n').map(s => s.trim()).filter(s => s && !shifts.includes(s));
            if (newItems.length > 0) {
                shifts.push(...newItems);
                saveShifts();
                input.value = '';
                renderShiftList();
                renderTable();
                alert('成功新增岗位！');
            }
        }

        function removeShift(shiftName) {
            if (shiftName === '休') { alert('「休」无法删除！'); return; }
            if (!confirm(`确定移除岗位「${shiftName}」？`)) return;
            shifts = shifts.filter(s => s !== shiftName);
            saveShifts();
            renderShiftList();
            renderTable();
        }

        function renderShiftList() {
            const container = document.getElementById('shift-list-container');
            document.getElementById('shift-count').innerText =`${shifts.length} 个`;
            let html = '';
            shifts.forEach(s => {
                html += `<span class="bg-indigo-50 border border-indigo-200 text-indigo-700 px-2 py-1 rounded-lg flex items-center gap-1 font-medium">
                    ${s} ${s !== '休' ? `<button onclick="removeShift('${s}')" class="text-rose-500 hover:text-rose-700 font-bold ml-1">×</button>` : ''}
                </span>`;
            });
            container.innerHTML = html;
        }

        async function loadSchedulesFromCloud() {
            const monthKey = document.getElementById('month-select').value;
            const { data } = await _supabase.from('schedules').select('*').eq('month_key', monthKey);
            currentSchedules = {};
            if (data) {
                data.forEach(item => {
                    currentSchedules[`${item.employee}_${item.date_str}`] = item.shift;
                });
            }
        }

        function renderTable() {
            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            document.getElementById('table-title').innerText = `📊 ${year}年${month}月 排班与岗位工作表预览`;

            const table = document.getElementById('schedule-table');
            if (employees.length === 0) {
                table.innerHTML = '<tr><td colspan="32" class="text-center py-12 text-slate-400 text-sm">请先在左侧新增员工，即可开始排班与分配岗位！</td></tr>';
                return;
            }

            let html = '';
            html += '<thead><tr class="bg-slate-100 border-b border-slate-200 text-xs text-slate-600 uppercase tracking-wider">';
            html += '<th class="p-3 sticky left-0 bg-slate-100 z-10 w-28">员工姓名</th>';
            for (let d = 1; d <= daysInMonth; d++) {
                html += `<th class="p-2 text-center min-w-[55px]">${d}日</th>`;
            }
            html += '</tr></thead>';

            html += '<tbody class="divide-y divide-slate-100 text-sm">';
            employees.forEach(emp => {
                html += `<tr class="hover:bg-slate-50/50">`;
                html += `<td class="p-3 font-semibold text-slate-800 sticky left-0 bg-white z-10 shadow-sm">${emp}</td>`;

                for (let d = 1; d <= daysInMonth; d++) {
                    const dayStr = String(d).padStart(2, '0');
                    const dateStr = `${monthKey}-${dayStr}`;
                    const key = `${emp}_${dateStr}`;
                    const shift = currentSchedules[key] || '';
                    
                    const isLocked = (shift === '休(固定)');

                    if (isLocked) {
                        html += `<td class="p-2 text-center bg-rose-50 text-rose-700 font-bold text-xs whitespace-nowrap" title="员工自排休假，无法更改">休(固定)</td>`;
                    } else {
                        html += `<td class="p-2 text-center">
                            <select onchange="handleShiftChange('${emp}', '${dateStr}', this.value)" class="w-full text-center bg-transparent border border-slate-200 rounded p-1 text-xs focus:ring-2 focus:ring-indigo-500">
                                <option value="" ${shift === '' ? 'selected' : ''}>-</option>`;
                        shifts.forEach(s => {
                            const val = (s === '休') ? '休' : s;
                            const selected = (shift === val) ? 'selected' : '';
                            html += `<option value="${val}" ${selected}>${s}</option>`;
                        });
                        html += `</select></td>`;
                    }
                }
                html += `</tr>`;
            });
            html += '</tbody>';
            table.innerHTML = html;
        }

        async function handleShiftChange(employee, dateStr, shift) {
            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('同步中...', 'bg-amber-500 text-white');

            if (shift === '') {
                await _supabase.from('schedules').delete().match({ employee: employee, date_str: dateStr });
                delete currentSchedules[`${employee}_${dateStr}`];
            } else {
                const { error } = await _supabase.from('schedules').upsert([
                    { month_key: monthKey, employee: employee, date_str: dateStr, shift: shift }
                ], { onConflict: 'employee,date_str' });

                if (error) { alert('储存失败: ' + error.message); return; }
                currentSchedules[`${employee}_${dateStr}`] = shift;
            }
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        // 智慧解析贴上的试算表假表文字
        async function importPastedLeaves() {
            const rawText = document.getElementById('paste-sheet-data').value.trim();
            if (!rawText) { alert('请先将假表范围复制并贴上！'); return; }
            if (employees.length === 0) { alert('请先在左侧建立员工名单！'); return; }

            const monthKey = document.getElementById('month-select').value;
            const lines = rawText.split('\n');
            let batchData = [];

            updateSyncStatus('解析假表中...', 'bg-amber-500 text-white');

            // 逐行解析贴上的表格资料
            lines.forEach(line => {
                const cols = line.split('\t'); // 试算表复制贴上通常以 Tab 分隔栏位
                if (cols.length < 2) return;

                const rowName = cols[0].trim();
                // 检查这一行是否属于我们建立的员工名单之一
                if (employees.includes(rowName)) {
                    // 从第 2 个栏位开始检查每个日期（对应 1 号到 31 号）
                    for (let i = 1; i < cols.length; i++) {
                        const cellValue = cols[i].trim();
                        // 如果格子里面有填数字（例如 '1'）代表该天休假
                        if (cellValue !== '' && !isNaN(cellValue)) {
                            const dayNum = i; // 假设第 1 列是姓名，第 2 列是 1 日...
                            if (dayNum >= 1 && dayNum <= 31) {
                                const dayStr = String(dayNum).padStart(2, '0');
                                const dateStr = `${monthKey}-${dayStr}`;
                                batchData.push({
                                    month_key: monthKey,
                                    employee: rowName,
                                    date_str: dateStr,
                                    shift: '休(固定)'
                                });
                            }
                        }
                    }
                }
            });

            if (batchData.length === 0) {
                alert('解析失败：未在贴上的内容中找到相符的员工姓名或假表数据，请确认是否包含员工姓名与填入的休假数字！');
                updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
                return;
            }

            const { error } = await _supabase.from('schedules').upsert(batchData, { onConflict: 'employee,date_str' });
            if (error) { alert('写入假表失败: ' + error.message); return; }

            await loadSchedulesFromCloud();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert(`成功解析并锁定 ${batchData.length 筆} 员工自排休假！`);
        }

        async function autoSchedule() {
            if (employees.length === 0) { alert('请先新增至少一位员工！'); return; }
            if (shifts.length <= 1) { alert('请先新增至少一个岗位！'); return; }
            if (!confirm('确定要执行一键智能排班吗？')) return;

            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            updateSyncStatus('岗位运算中...', 'bg-amber-500 text-white');

            let batchData = [];
            const availableShifts = shifts.filter(s => s !== '休');

            employees.forEach((emp, index) => {
                for (let d = 1; d <= daysInMonth; d++) {
                    const dayStr = String(d).padStart(2, '0');
                    const dateStr = `${monthKey}-${dayStr}`;
                    const key = `${emp}_${dateStr}`;
                    
                    if (currentSchedules[key] === '休(固定)') continue; // 保留员工自排假不覆盖

                    const assignedShift = availableShifts[(d + index) % availableShifts.length];
                    batchData.push({ month_key: monthKey, employee: emp, date_str: dateStr, shift: assignedShift });
                }
            });

            const { error } = await _supabase.from('schedules').upsert(batchData, { onConflict: 'employee,date_str' });
            if (error) { alert('排班失败: ' + error.message); return; }

            await loadSchedulesFromCloud();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert('一键智能排班完成！');
        }

        async function clearMonthLeaves() {
            if (!confirm('确定要清空当月所有岗位与排班资料吗？')) return;
            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('清空中...', 'bg-rose-500 text-white');

            const { error } = await _supabase.from('schedules').delete().eq('month_key', monthKey);
            if (error) { alert('清空失败: ' + error.message); return; }

            currentSchedules = {};
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert('当月资料已全数清空！');
        }

        document.getElementById('month-select').addEventListener('change', async () => {
            await loadSchedulesFromCloud();
            renderTable();
        });

        init();
    </script>
</body>
</html>
