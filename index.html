<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧排班系统 (云端同步版)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- 顶部标头 -->
        <header class="bg-white shadow rounded-2xl p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">🏢 智慧排班与云端假表系统</h1>
                <p class="text-sm text-slate-500 mt-1">云端资料自动同步，固定休假锁定不可变动</p>
            </div>
            <!-- 功能按键群组 -->
            <div class="flex flex-wrap items-center gap-3">
                <button onclick="importDefaultLeaves()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                    📥 一键导入假表
                </button>
                <button onclick="clearAllLeaves()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                    🗑️ 一键清空假表
                </button>
                <div id="sync-status" class="text-xs bg-amber-100 text-amber-800 px-3 py-1.5 rounded-full font-medium">
                    🔄 连线同步中...
                </div>
            </div>
        </header>

        <!-- 主控制面板 -->
        <section class="bg-white shadow rounded-2xl p-6">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <label for="month-select" class="font-semibold text-slate-700">选择排班月份：</label>
                    <input type="month" id="month-select" class="border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value="2026-10">
                </div>
                <div class="text-xs text-slate-500 bg-slate-100 px-3 py-2 rounded-xl">
                    💡 提示：带有「休 (固定)」标记的格子由云端假表管制，无法直接手动变动。
                </div>
            </div>
        </section>

        <!-- 排班表格区域 -->
        <section class="bg-white shadow rounded-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table id="schedule-table" class="w-full text-left border-collapse">
                    <!-- 动态生成 -->
                </table>
            </div>
        </section>
    </div>

    <script>
        // ======= 请在此填入你的 Supabase 凭证 =======
        const SUPABASE_URL = 'https://untcdzgliocuplqifejc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_exIdFgcOJ3eIRXrahU5LAw_Tr_43AMw';

        // 初始化 Supabase 客户端
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 模拟员工名单
        const employees = ['员工 A', '员工 B', '员工 C', '员工 D'];
        
        let currentSchedules = {}; // 储存从云端抓取的排班/休假资料

        async function init() {
            updateSyncStatus('連線中...', 'bg-amber-100 text-amber-800');
            await loadSchedulesFromCloud();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-100 text-emerald-800');
        }

        function updateSyncStatus(text, className) {
            const badge = document.getElementById('sync-status');
            badge.className = `text-xs px-3 py-1.5 rounded-full font-medium ${className}`;
            badge.innerText = text;
        }

        // 从云端读取排班与假表
        async function loadSchedulesFromCloud() {
            const monthKey = document.getElementById('month-select').value;
            const { data, error } = await _supabase
                .from('schedules')
                .select('*')
                .eq('month_key', monthKey);

            currentSchedules = {};
            if (error) {
                console.error('读取云端资料失败:', error.message);
                return;
            }

            if (data) {
                data.forEach(item => {
                    currentSchedules[`${item.employee}_${item.date_str}`] = item.shift;
                });
            }
        }

        // 渲染排班表格
        function renderTable() {
            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            const table = document.getElementById('schedule-table');
            let html = '';

            // 表头
            html += '<thead><tr class="bg-slate-100 border-b border-slate-200 text-xs text-slate-600 uppercase tracking-wider">';
            html += '<th class="p-3 sticky left-0 bg-slate-100 z-10 w-28">员工姓名</th>';
            for (let d = 1; d <= daysInMonth; d++) {
                html += `<th class="p-2 text-center min-w-[45px]">${d}日</th>`;
            }
            html += '</tr></thead>';

            // 表身
            html += '<tbody class="divide-y divide-slate-100 text-sm">';
            employees.forEach(emp => {
                html += `<tr class="hover:bg-slate-50/50">`;
                html += `<td class="p-3 font-semibold text-slate-800 sticky left-0 bg-white z-10 shadow-sm">${emp}</td>`;

                for (let d = 1; d <= daysInMonth; d++) {
                    const dayStr = String(d).padStart(2, '0');
                    const dateStr = `${monthKey}-${dayStr}`;
                    const key = `${emp}_${dateStr}`;
                    const shift = currentSchedules[key] || '';
                    
                    // 判断是否为云端锁定的固定休假
                    const isLockedLeave = (shift === '休(固定)' || shift === '休');

                    if (isLockedLeave) {
                        html += `<td class="p-2 text-center bg-rose-50 text-rose-700 font-bold text-xs" title="云端固定休假，无法更改">休(固定)</td>`;
                    } else {
                        html += `<td class="p-2 text-center">
                            <select onchange="handleShiftChange('${emp}', '${dateStr}', this.value)" class="w-full text-center bg-transparent border border-slate-200 rounded p-1 text-xs focus:ring-2 focus:ring-indigo-500">
                                <option value="" ${shift === '' ? 'selected' : ''}>-</option>
                                <option value="早" ${shift === '早' ? 'selected' : ''}>早</option>
                                <option value="晚" ${shift === '晚' ? 'selected' : ''}>晚</option>
                                <option value="休" ${shift === '休' ? 'selected' : ''}>休</option>
                            </select>
                        </td>`;
                    }
                }
                html += `</tr>`;
            });
            html += '</tbody>';
            table.innerHTML = html;
        }

        // 储存排班变动至云端
        async function handleShiftChange(employee, dateStr, shift) {
            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('同步中...', 'bg-amber-100 text-amber-800');

            if (shift === '') {
                // 如果清空，则从云端删除
                await _supabase.from('schedules').delete().match({ employee: employee, date_str: dateStr });
                delete currentSchedules[`${employee}_${dateStr}`];
            } else {
                // 否则写入或更新
                const { error } = await _supabase.from('schedules').upsert([
                    { month_key: monthKey, employee: employee, date_str: dateStr, shift: shift }
                ], { onConflict: 'employee,date_str' });

                if (error) {
                    alert('储存失败: ' + error.message);
                    return;
                }
                currentSchedules[`${employee}_${dateStr}`] = shift;
            }
            updateSyncStatus('已同步云端', 'bg-emerald-100 text-emerald-800');
        }

        // 一键导入预设假表（示范：让每位员工周六或特定日期自动填入「休(固定)」）
        async function importDefaultLeaves() {
            if (!confirm('确定要一键导入本月固定假表吗？')) return;
            
            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();
            
            updateSyncStatus('导入假表中...', 'bg-amber-100 text-amber-800');
            
            let batchData = [];
            employees.forEach(emp => {
                for (let d = 1; d <= daysInMonth; d++) {
                    const currentDate = new Date(year, month - 1, d);
                    // 示范规则：每逢星期日自动设为固定休假
                    if (currentDate.getDay() === 0) {
                        const dayStr = String(d).padStart(2, '0');
                        const dateStr = `${monthKey}-${dayStr}`;
                        batchData.push({
                            month_key: monthKey,
                            employee: emp,
                            date_str: dateStr,
                            shift: '休(固定)'
                        });
                    }
                }
            });

            // 写入云端
            const { error } = await _supabase.from('schedules').upsert(batchData, { onConflict: 'employee,date_str' });
            if (error) {
                alert('导入假表失败: ' + error.message);
                return;
            }

            await loadSchedulesFromCloud();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-100 text-emerald-800');
            alert('成功一键导入云端假表！');
        }

        // 一键清空本月假表/排班
        async function clearAllLeaves() {
            if (!confirm('警告：这将会清空本月所有的排班与假表资料，确定执行吗？')) return;

            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('清空中...', 'bg-rose-100 text-rose-800');

            const { error } = await _supabase.from('schedules').delete().eq('month_key', monthKey);
            if (error) {
                alert('清空失败: ' + error.message);
                return;
            }

            currentSchedules = {};
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-100 text-emerald-800');
            alert('本月资料已全数清空！');
        }

        // 监听月份切换
        document.getElementById('month-select').addEventListener('change', init);

        // 初始执行
        init();
    </script>
</body>
</html>
