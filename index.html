<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能动态排班管理设置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <header class="bg-indigo-600 text-white shadow rounded-2xl p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">⚙️</span>
                <div>
                    <h1 class="text-2xl font-bold">智能动态排班管理设置</h1>
                    <p class="text-xs text-indigo-200 mt-1">云端假表 ｜ 固定休假 ｜ 按人数套用岗位 ｜ 锁定保护</p>
                </div>
            </div>
            <div id="sync-status" class="text-xs bg-indigo-500 text-white px-4 py-2 rounded-full font-medium shadow-inner">
                🔄 连线同步中...
            </div>
        </header>

        <div class="bg-white shadow rounded-2xl p-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center border-b border-slate-100 pb-6">
                <div>
                    <label class="block font-bold text-slate-700 text-sm mb-1">📅 选择排班月份：</label>
                    <input type="month" id="month-select" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value="2026-10">
                </div>

                <div class="md:col-span-2">
                    <label class="block font-bold text-slate-700 text-sm mb-1">👥 员工管理：</label>
                    <div class="flex flex-wrap gap-2 items-center">
                        <input type="text" id="new-employee-name" placeholder="输入员工姓名..." class="border border-slate-300 rounded-xl px-3 py-2 text-sm w-48 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="addEmployee()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">添加</button>
                        <button onclick="removeSelectedEmployee()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition">移除选中</button>
                        <select id="employee-select-target" class="border border-slate-300 rounded-xl px-3 py-2 text-sm flex-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">-- 选择要管理的员工 --</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="space-y-2 border-b border-slate-100 pb-6">
                <label class="block font-bold text-slate-700 text-sm">📥 导入当前月份的云端假表连结 (Google Sheets)：</label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="cloud-sheet-url" placeholder="请贴上云端 Google Sheets 共用连结..." 
                        class="flex-1 border border-slate-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="importCloudLeaves()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm whitespace-nowrap">
                        🟢 抓取当月休假日
                    </button>
                    <button onclick="clearMonthLeaves()" class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-sm whitespace-nowrap">
                        🗑️ 清空当月休假
                    </button>
                </div>
                <p class="text-xs text-slate-400">💡 提示：请确保 Google 试算表已设为「知道连结的人都能检视」，且员工姓名与上方列表相符，休假格填入 **1**。</p>
            </div>

            <!-- 每日岗位组合设定 -->
            <div class="space-y-3 border-t border-slate-100 pt-6">
                <label class="block font-bold text-slate-700 text-sm">📋 每日岗位组合设定（依当天上班人数自动套用）：</label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="number" id="combo-headcount" placeholder="人数" min="1" max="50" class="w-24 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="text" id="combo-shifts" placeholder="岗位（用逗号分隔），例如：AI,BUG,彩票,外接,团队" class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="saveCombo()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-xl text-sm font-medium transition whitespace-nowrap">新增 / 更新组合</button>
                </div>
                <div id="combo-list-container" class="space-y-2 pt-2"></div>
                <p class="text-xs text-slate-400">💡 排班时：当天上班人数 → 找最接近的组合 → 按日期轮流分配。人数超过组合时，多出的给「支援」。</p>
            </div>

            <!-- 锁定管理 -->
            <div class="space-y-3 border-t border-slate-100 pt-6">
                <label class="block font-bold text-slate-700 text-sm">🔒 锁定管理：</label>
                <div class="flex flex-wrap gap-2 items-center">
                    <button onclick="lockAllMonth()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                        🔒 一键锁定整月
                    </button>
                    <button onclick="unlockAllMonth()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                        🔓 一键解锁整月
                    </button>
                    <button onclick="lockHistoryDates()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                        🕰️ 锁定历史日期（今天以前）
                    </button>
                    <span id="lock-stat" class="text-xs text-slate-500 ml-2">本月已锁定 0 格</span>
                </div>
                <p class="text-xs text-slate-400">💡 开启手动修改模式后，每个非固定休假的格子旁会有小锁图示，点它可单格锁定/解锁。锁定后完全冻结，智能排班也会跳过。</p>
            </div>

            <div class="flex flex-wrap gap-3 pt-2 items-center">
                <button onclick="autoSchedule()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">
                    ✨ 执行智能排班
                </button>
                <button onclick="toggleEditMode()" id="edit-mode-btn" class="bg-amber-500 hover:bg-amber-600 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">
                    ✍️ 开启手动修改
                </button>
                <button onclick="validateDuplicateShifts()" class="bg-cyan-600 hover:bg-cyan-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">
                    🔍 校验排班重复岗位
                </button>
                <button onclick="validateConsecutiveShifts()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">
                    ⚠️ 校验连排岗位
                </button>
                <button onclick="clearMonthData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-5 py-2.5 rounded-xl text-sm font-medium transition ml-auto">
                    重置当月资料
                </button>
            </div>
        </div>

        <div class="bg-white shadow rounded-2xl p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                <h2 id="table-title" class="font-bold text-slate-800 text-lg">📊 排班工作表预览</h2>
                <span id="mode-tip" class="text-xs text-amber-600 font-medium">🔒 目前为检视模式（点选上方「开启手动修改」即可编辑）</span>
            </div>
            <div class="overflow-x-auto min-h-[400px]">
                <table id="schedule-table" class="w-full text-left border-collapse"></table>
            </div>
        </div>
    </div>

    <div id="modal-container" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 id="modal-title" class="font-bold text-slate-800 text-base">系统讯息</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">×</button>
            </div>
            <div id="modal-content" class="max-h-96 overflow-y-auto text-sm text-slate-700 space-y-2"></div>
            <div class="flex justify-end pt-2">
                <button onclick="closeModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium">关闭</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://untcdzgliocuplqifejc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_exIdFgcOJ3eIRXrahU5LAw_Tr_43AMw';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let employees = [];
        let combos = [];
        let currentSchedules = {};
        let lockedCells = new Set();   // "employee_dateStr"
        let isEditMode = false;

        const CLOUD_URL_KEY = 'cloud_sheet_url';

        // ===== 云端设定 =====
        async function saveCloudUrl(url) {
            const { error } = await _supabase.from('settings').upsert(
                { key: CLOUD_URL_KEY, value: url, updated_at: new Date().toISOString() },
                { onConflict: 'key' }
            );
            if (error) console.error('储存云端假表连结失败:', error);
        }

        async function loadCloudUrl() {
            const { data, error } = await _supabase
                .from('settings').select('value').eq('key', CLOUD_URL_KEY).maybeSingle();
            if (error) { console.error('读取失败:', error); return ''; }
            return data ? data.value : '';
        }

        // ===== 岗位组合 =====
        async function loadCombos() {
            const { data, error } = await _supabase.from('shift_combos').select('*').order('headcount', { ascending: true });
            if (error) { console.error('读取岗位组合失败:', error); combos = []; return; }
            combos = (data || []).map(row => ({
                id: row.id,
                headcount: row.headcount,
                shifts: Array.isArray(row.shifts) ? row.shifts : JSON.parse(row.shifts || '[]')
            }));
        }

        async function saveCombo() {
            const hcInput = document.getElementById('combo-headcount');
            const shInput = document.getElementById('combo-shifts');
            const hc = parseInt(hcInput.value, 10);
            const shiftText = shInput.value.trim();

            if (!hc || hc < 1) { alert('请输入正确的人数！'); return; }
            if (!shiftText) { alert('请输入岗位（用逗号分隔）！'); return; }

            const shiftArr = shiftText.split(/[,，]/).map(s => s.trim()).filter(s => s);
            if (shiftArr.length === 0) { alert('岗位不能为空！'); return; }

            updateSyncStatus('同步中...', 'bg-amber-500 text-white');
            const { error } = await _supabase.from('shift_combos').upsert(
                { headcount: hc, shifts: shiftArr, updated_at: new Date().toISOString() },
                { onConflict: 'headcount' }
            );
            if (error) { alert('储存组合失败: ' + error.message); updateSyncStatus('已同步云端', 'bg-emerald-500 text-white'); return; }

            hcInput.value = '';
            shInput.value = '';
            await loadCombos();
            renderComboList();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert(`已储存「${hc} 人上班」的岗位组合！`);
        }

        async function deleteCombo(id, headcount) {
            if (!confirm(`确定删除「${headcount} 人上班」的组合吗？`)) return;
            updateSyncStatus('同步中...', 'bg-amber-500 text-white');
            const { error } = await _supabase.from('shift_combos').delete().eq('id', id);
            if (error) { alert('删除失败: ' + error.message); return; }
            await loadCombos();
            renderComboList();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        function editCombo(id) {
            const c = combos.find(x => x.id === id);
            if (!c) return;
            document.getElementById('combo-headcount').value = c.headcount;
            document.getElementById('combo-shifts').value = c.shifts.join(',');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderComboList() {
            const container = document.getElementById('combo-list-container');
            if (combos.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 italic">目前没有岗位组合，请上方新增。</p>';
                return;
            }
            let html = '';
            combos.forEach(c => {
                html += `<div class="flex flex-wrap items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                    <span class="bg-indigo-600 text-white text-xs font-bold px-2 py-1 rounded">${c.headcount} 人</span>
                    <span class="text-sm text-slate-700 flex-1">${c.shifts.join(' , ')}</span>
                    <button onclick="editCombo(${c.id})" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">编辑</button>
                    <button onclick="deleteCombo(${c.id}, ${c.headcount})" class="text-xs text-rose-600 hover:text-rose-800 font-medium">删除</button>
                </div>`;
            });
            container.innerHTML = html;
        }

        function getAllShiftNames() {
            const set = new Set();
            combos.forEach(c => c.shifts.forEach(s => set.add(s)));
            set.add('休');
            set.add('支援');
            return Array.from(set);
        }

        function findClosestCombo(headcount) {
            if (combos.length === 0) return null;
            const exact = combos.find(c => c.headcount === headcount);
            if (exact) return exact;
            let best = combos[0];
            let bestDiff = Math.abs(combos[0].headcount - headcount);
            combos.forEach(c => {
                const diff = Math.abs(c.headcount - headcount);
                if (diff < bestDiff) { best = c; bestDiff = diff; }
            });
            return best;
        }

        // ===== 锁定资料 =====
        function lockKey(emp, dateStr) { return `${emp}_${dateStr}`; }

        function isLocked(emp, dateStr) {
            return lockedCells.has(lockKey(emp, dateStr));
        }

        async function loadLockedCells() {
            const monthKey = document.getElementById('month-select').value;
            const { data, error } = await _supabase
                .from('locked_cells').select('employee, date_str').eq('month_key', monthKey);
            lockedCells = new Set();
            if (error) { console.error('读取锁定资料失败:', error); return; }
            (data || []).forEach(row => {
                lockedCells.add(lockKey(row.employee, row.date_str));
            });
            updateLockStat();
        }

        function updateLockStat() {
            const el = document.getElementById('lock-stat');
            if (el) el.innerText = `本月已锁定 ${lockedCells.size} 格`;
        }

        async function lockCell(emp, dateStr, reason = 'manual') {
            const monthKey = document.getElementById('month-select').value;
            const { error } = await _supabase.from('locked_cells').upsert(
                { month_key: monthKey, employee: emp, date_str: dateStr, reason: reason },
                { onConflict: 'employee,date_str' }
            );
            if (error) { alert('锁定失败: ' + error.message); return; }
            lockedCells.add(lockKey(emp, dateStr));
            updateLockStat();
            renderTable();
        }

        async function unlockCell(emp, dateStr) {
            const { error } = await _supabase.from('locked_cells')
                .delete().match({ employee: emp, date_str: dateStr });
            if (error) { alert('解锁失败: ' + error.message); return; }
            lockedCells.delete(lockKey(emp, dateStr));
            updateLockStat();
            renderTable();
        }

        // 单格切换锁定（小锁图示用）
        async function toggleLockCell(emp, dateStr) {
            if (isLocked(emp, dateStr)) {
                await unlockCell(emp, dateStr);
            } else {
                await lockCell(emp, dateStr, 'manual');
            }
        }

        // 一键锁定整月（锁所有员工 × 所有日期，含空白）
        async function lockAllMonth() {
            if (employees.length === 0) { alert('请先添加员工！'); return; }
            if (!confirm(`确定要锁定本月【所有格子】吗？\n（含空白格、固定休假格，共 ${employees.length} 人 × 整月）\n锁定后连智能排班都会跳过。`)) return;

            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            updateSyncStatus('锁定中...', 'bg-amber-500 text-white');

            const batch = [];
            employees.forEach(emp => {
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${monthKey}-${String(d).padStart(2, '0')}`;
                    batch.push({
                        month_key: monthKey,
                        employee: emp,
                        date_str: dateStr,
                        reason: 'all_month'
                    });
                }
            });

            const dedupMap = new Map();
            batch.forEach(item => dedupMap.set(`${item.employee}_${item.date_str}`, item));
            const dedupData = Array.from(dedupMap.values());

            const { error } = await _supabase.from('locked_cells').upsert(dedupData, { onConflict: 'employee,date_str' });
            if (error) { alert('锁定失败: ' + error.message); return; }

            await loadLockedCells();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert(`已锁定本月 ${dedupData.length} 格！`);
        }

        // 一键解锁整月
        async function unlockAllMonth() {
            if (!confirm('确定要解锁本月【所有格子】吗？')) return;
            const monthKey = document.getElementById('month-select').value;
            updateSyncStatus('解锁中...', 'bg-amber-500 text-white');

            const { error } = await _supabase.from('locked_cells').delete().eq('month_key', monthKey);
            if (error) { alert('解锁失败: ' + error.message); return; }

            await loadLockedCells();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert('本月所有锁定已解除！');
        }

        // 锁定历史日期（今天以前，不含今天）
        async function lockHistoryDates() {
            if (employees.length === 0) { alert('请先添加员工！'); return; }
            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // 找出「今天以前」的日期
            const pastDays = [];
            for (let d = 1; d <= daysInMonth; d++) {
                const dt = new Date(year, month - 1, d);
                dt.setHours(0, 0, 0, 0);
                if (dt < today) pastDays.push(d);
            }

            if (pastDays.length === 0) {
                alert('本月没有「今天以前」的日期可锁定。');
                return;
            }

            if (!confirm(`确定要锁定本月 ${pastDays.length} 天（今天以前）的所有格子吗？\n（共 ${employees.length} 人 × ${pastDays.length} 天）`)) return;

            updateSyncStatus('锁定中...', 'bg-amber-500 text-white');

            const batch = [];
            employees.forEach(emp => {
                pastDays.forEach(d => {
                    const dateStr = `${monthKey}-${String(d).padStart(2, '0')}`;
                    batch.push({
                        month_key: monthKey,
                        employee: emp,
                        date_str: dateStr,
                        reason: 'history'
                    });
                });
            });

            const dedupMap = new Map();
            batch.forEach(item => dedupMap.set(`${item.employee}_${item.date_str}`, item));
            const dedupData = Array.from(dedupMap.values());

            const { error } = await _supabase.from('locked_cells').upsert(dedupData, { onConflict: 'employee,date_str' });
            if (error) { alert('锁定失败: ' + error.message); return; }

            await loadLockedCells();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
            alert(`已锁定历史日期：${pastDays.length} 天 × ${employees.length} 人 = ${dedupData.length} 格。`);
        }

        // ===== 初始化 =====
        async function init() {
            updateSyncStatus('连线中...', 'bg-amber-500 text-white');
            await loadEmployees();
            await loadCombos();
            await loadSchedulesFromCloud();
            await loadLockedCells();

            const savedUrl = await loadCloudUrl();
            if (savedUrl) document.getElementById('cloud-sheet-url').value = savedUrl;

            renderEmployeeSelect();
            renderComboList();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        function updateSyncStatus(text, className) {
            const badge = document.getElementById('sync-status');
            badge.className = `text-xs px-3 py-1.5 rounded-full font-medium shadow-inner ${className}`;
            badge.innerText = text;
        }

        async function loadEmployees() {
            const { data } = await _supabase.from('employees').select('*').order('created_at', { ascending: true });
            employees = data ? data.map(item => item.name) : [];
        }

        async function addEmployee() {
            const input = document.getElementById('new-employee-name');
            const name = input.value.trim();
            if (!name) return;
            if (employees.includes(name)) { alert('员工已存在！'); return; }

            updateSyncStatus('同步中...', 'bg-amber-500 text-white');
            await _supabase.from('employees').insert([{ name }]);
            input.value = '';
            await loadEmployees();
            renderEmployeeSelect();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        async function removeSelectedEmployee() {
            const select = document.getElementById('employee-select-target');
            const name = select.value;
            if (!name) { alert('请先在下拉选单选择要移除的员工！'); return; }
            if (!confirm(`确定要移除员工「${name}」吗？`)) return;

            updateSyncStatus('同步中...', 'bg-amber-500 text-white');
            await _supabase.from('employees').delete().eq('name', name);
            await _supabase.from('schedules').delete().eq('employee', name);
            await _supabase.from('locked_cells').delete().eq('employee', name);
            await loadEmployees();
            await loadSchedulesFromCloud();
            await loadLockedCells();
            renderEmployeeSelect();
            renderTable();
            updateSyncStatus('已同步云端', 'bg-emerald-500 text-white');
        }

        function renderEmployeeSelect() {
            const select = document.getElementById('employee-select-target');
            let html = '<option value="">-- 选择要管理的员工 (' + employees.length + '人) --</option>';
            employees.forEach(emp => {
                html += `<option value="${emp}">${emp}</option>`;
            });
            select.innerHTML = html;
        }

        async function loadSchedulesFromCloud() {
            const monthKey = document.getElementById('month-select').value;
            const { data } = await _supabase.from('schedules').select('*').eq('month_key', monthKey);
            currentSchedules = {};
            if (data) {
                data.forEach(item => {
                    currentSchedules[`${item.employee}_${item.date_str}`] = item.shift;
                });
            }
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('edit-mode-btn');
            const tip = document.getElementById('mode-tip');
            if (isEditMode) {
                btn.className = "bg-rose-500 hover:bg-rose-600 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-sm";
                btn.innerText = "🔒 关闭手动修改";
                tip.className = "text-xs text-rose-600 font-medium";
                tip.innerText = "✍️ 手动修改模式（🔒 休 与锁定格不可改，点小锁可切换锁定）";
            } else {
                btn.className = "bg-amber-500 hover:bg-amber-600 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-sm";
                btn.innerText = "✍️ 开启手动修改";
                tip.className = "text-xs text-amber-600 font-medium";
                tip.innerText = "🔒 检视模式（点选上方「开启手动修改」即可编辑）";
            }
            renderTable();
        }

        function isFixedRest(shift) {
            return shift === '休' || shift === '休(固定)' || shift === '休(固定假)';
        }

        function renderTable() {
            const monthKey = document.getElementById('month-select').value;
            const [year, month] = monthKey.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            document.getElementById('table-title').innerText = `📊 ${year}年${month}月 排班工作表预览`;

            const table = document.getElementById('schedule-table');
            if (employees.length === 0) {
                table.innerHTML = '<tr><td colspan="100" class="text-center py-12 text-slate-400 text-sm">请先上方添加员工，即可开始排班！</td></tr>';
                return;
            }

            const allShiftNames = getAllShiftNames();

            let html = '';
            html += '<thead><tr class="bg-slate-100 border-b border-slate-200 text-xs text-slate-600 uppercase tracking-wider">';
            html += '<th class="p-3 sticky left-0 bg-slate-100 z-10 w-32 text-center">员工姓名</th>';
            for (let d = 1; d <= daysInMonth; d++) {
                html += `<th class="p-2 text-center min-w-[55px]">${d}日</th>`;
            }
            html += '</tr></thead>';

            html += '<tbody class="divide-y divide-slate-100 text-sm">';
            employees.forEach(emp => {
                html += `<tr class="hover:bg-slate-50/50">`;
                html += `<td class="p-3 font-semibold text-slate-800 sticky left-0 bg-white z-10 shadow-sm whitespace-nowrap">${emp}</td>`;

                for (let d = 1; d <= daysInMonth; d++) {
                    const dayStr = String(d).padStart(2, '0');
                    const dateStr = `${monthKey}-${dayStr}`;
                    const key = `${emp}_${dateStr}`;
                    const rawShift = currentSchedules[key] || '';
                    const isRest = isFixedRest(rawShift);
                    const displayShift = isRest ? '休' : rawShift;
                    const locked = isLocked(emp, dateStr);

                    if (!isEditMode) {
                        // 检视模式
                        let badgeClass = 'text-slate-400';
                        if (isRest) badgeClass = 'bg-rose-100 text-rose-700 font-bold px-1.5 py-0.5 rounded text-xs';
                        else if (displayShift) badgeClass = 'bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded text-xs font-medium';

                        const lockIcon = locked ? '<span class="text-slate-500 text-[10px]">🔒</span>' : '';
                        html += `<td class="p-2 text-center relative">
                            ${lockIcon ? `<div class="absolute top-0 right-0 text-[9px]">${lockIcon}</div>` : ''}
                            <span class="${badgeClass}">${displayShift || '-'}</span>
                        </td>`;
                    } else {
                        // 手动修改模式
                        if (isRest) {
                            // 固定休假：锁死
                            html += `<td class="p-1 text-center relative">
                                <span class="inline-block w-full bg-rose-100 text-rose-700 font-bold border border-rose-300 rounded p-1 text-xs cursor-not-allowed" title="固定休假，不可修改">
                                    🔒 休
                                </span>
                            </td>`;
                        } else if (locked) {
                            // 锁定格：不可改，但有小锁可点解锁
                            html += `<td class="p-1 text-center relative">
                                <span class="inline-block w-full bg-slate-200 text-slate-700 font-bold border border-slate-400 rounded p-1 text-xs cursor-not-allowed" title="已锁定，点右上小锁解锁">
                                    🔒 ${displayShift || '-'}
                                </span>
                                <button onclick="toggleLockCell('${emp}', '${dateStr}')" class="absolute -top-1 -right-1 bg-white border border-slate-400 rounded-full w-4 h-4 flex items-center justify-center text-[9px] hover:bg-amber-100" title="点击解锁">🔓</button>
                            </td>`;
                        } else {
                            // 可编辑格
                            html += `<td class="p-1 text-center relative">
                                <select onchange="handleShiftChange('${emp}', '${dateStr}', this.value)" class="w-full text-center border rounded p-1 text-xs bg-transparent border-slate-200 focus:ring-2 focus:ring-indigo-500">
                                    <option value="" ${displayShift === '' ? 'selected' : ''}>-</option>`;

                            allShiftNames.forEach(s => {
                                const selected = (displayShift === s) ? 'selected' : '';
                                html += `<option value="${s}" ${selected}>${s}</option>`;
                            });

                            if (displayShift && !allShiftNames.includes(displayShift)) {
                                html += `<option value="${displayShift}" selected>${displayShift}</option>`;
                            }

                            html += `</select>
                                <button onclick="toggleLockCell('${emp}', '${dateStr}')" class="absolute -top-1 -right-1 bg-white border border-slate-300 rounded-full w-4 h-4 flex items-center justify-center text-[9px] opacity-40 hover:opacity-100 hover:bg-amber-100" title="点击锁定">🔒</button>
                            </td>`;
                        }
                    }
                }
                html += `</tr>`;
            });
            html += '</tbody>';
            table.innerHTML = html;
        }
